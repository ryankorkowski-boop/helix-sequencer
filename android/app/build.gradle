plugins { id 'com.android.application'; id 'com.chaquo.python' }
// Release builds remain unsigned until the project owner supplies the established
// upload key. Never silently sign a production bundle with the debug certificate.
def signingKeys = ['HELIX_ANDROID_KEYSTORE', 'HELIX_ANDROID_STORE_PASSWORD', 'HELIX_ANDROID_KEY_ALIAS', 'HELIX_ANDROID_KEY_PASSWORD']
def releaseSigning = signingKeys.collect { System.getenv(it) }
if (releaseSigning.any { it } && !releaseSigning.every { it }) {
    throw new GradleException('Provide all four HELIX_ANDROID signing variables, or none')
}
android {
    namespace 'org.helixsequencer.android'
    compileSdk 36
    defaultConfig {
        applicationId 'org.helixsequencer.android'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.3.1-guidance-beta'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('generated/helixAssets') } }
    if (releaseSigning.every { it }) {
        signingConfigs {
            helixRelease {
                storeFile file(releaseSigning[0])
                storePassword releaseSigning[1]
                keyAlias releaseSigning[2]
                keyPassword releaseSigning[3]
            }
        }
        buildTypes { release { signingConfig signingConfigs.helixRelease } }
    }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
chaquopy {
    defaultConfig {
        version '3.10'
        if (System.getenv('HELIX_BUILD_PYTHON')) { buildPython System.getenv('HELIX_BUILD_PYTHON') }
        // Numba/LLVM has no current Android wheel. The separately tested Android
        // adapter executes the original librosa kernels without JIT compilation.
        pip {
            install '-r', '../requirements-android.txt'
            install '../build/pure/msgpack-1.0.8-py3-none-any.whl'
            install '../build/pure/librosa-0.10.2.post1-py3-none-any.whl'
        }
        extractPackages 'librosa'
    }
}
tasks.register('stageHelix', Exec) {
    workingDir '../..'
    commandLine System.getenv('HELIX_BUILD_PYTHON') ?: 'python3.10', 'tools/stage_android_engine.py', '--output', layout.buildDirectory.dir('generated/helixAssets').get().asFile
}
tasks.named('preBuild').configure { dependsOn 'stageHelix' }
tasks.register('buildPurePythonDeps', Exec) {
    inputs.file '../../tools/build_android_python_wheels.py'
    environment 'MSGPACK_PUREPYTHON', '1'
    commandLine System.getenv('HELIX_BUILD_PYTHON') ?: 'python3.10', '../../tools/build_android_python_wheels.py', '--output', '../build/pure'
    outputs.files '../build/pure/msgpack-1.0.8-py3-none-any.whl', '../build/pure/librosa-0.10.2.post1-py3-none-any.whl'
}
tasks.configureEach {
    if (name.startsWith('install') && name.endsWith('PythonRequirements')) { dependsOn 'buildPurePythonDeps' }
}

