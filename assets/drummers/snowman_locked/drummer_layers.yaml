# Helix approved layered snowman drummer manifest
asset_id: snowman_locked_drummer
version: 2
canvas:
  width: 2048
  height: 2048
  registration: full_canvas_same_origin
  format: png

base_layer:
  id: DRUMMER_BASE_LOCKED_DIM
  file: drummer_base_locked_dim.png
  role: locked_background
  alpha_mode: normal
  transparent_background: preferred
  intensity: 0.32
  stationary_components:
    - body
    - head
    - scarf
    - hat
    - torso
    - legs
    - dim_drum_kit_outline
  forbidden_motion:
    - active_strike_arms
    - moving_sticks
    - active_hihat_pedal

default_event_behavior:
  alpha_mode: transparent_overlay
  event_intensity: 1.25
  contact_glow_intensity: 1.65
  hit_hold_ms: 80
  hit_fade_ms: 180
  no_stationary_body_duplicates: true
  align_to_base_canvas: true

physical_contract:
  toms:
    - left_tom
    - right_tom
    - floor_tom
  forbidden_components:
    - fourth_tom
    - extra_far_right_drum
    - separate_ride_cymbal
  kick_contact: foot_or_beater_no_stick
  hihat_contact: foot_pedal_no_stick
  other_hit_contact: appropriate_arm_and_stick

layers:
  - id: DRUMMER_KICK
    event: kick
    file: drummer_hit_kick.png
    target_components:
      - kick_drum
    moving_components:
      - kick_foot_or_beater_pulse
      - kick_contact_glow
    decay_ms: 260

  - id: DRUMMER_SNARE
    event: snare
    file: drummer_hit_snare.png
    target_components:
      - snare
    moving_components:
      - left_arm_contact_pose
      - left_stick_touching_snare
      - snare_contact_glow
    decay_ms: 220

  - id: DRUMMER_TOM_L
    event: tom_left
    file: drummer_hit_left_tom.png
    target_components:
      - left_tom
    moving_components:
      - left_arm_contact_pose
      - left_stick_touching_left_tom
      - left_tom_contact_glow
    decay_ms: 220

  - id: DRUMMER_TOM_R
    event: tom_right
    file: drummer_hit_right_tom.png
    target_components:
      - right_tom
    moving_components:
      - right_arm_contact_pose
      - right_stick_touching_right_tom
      - right_tom_contact_glow
    decay_ms: 220

  - id: DRUMMER_FLOOR_TOM
    event: floor_tom
    file: drummer_hit_floor_tom.png
    target_components:
      - floor_tom
    moving_components:
      - right_arm_low_contact_pose
      - right_stick_touching_floor_tom
      - floor_tom_contact_glow
    decay_ms: 240

  - id: DRUMMER_HIHAT
    event: hihat
    file: drummer_hit_hihat.png
    target_components:
      - hihat
    moving_components:
      - hihat_foot
      - hihat_pedal
      - tight_hihat_contact_glow
    decay_ms: 120
    shimmer_ms: 80

  - id: DRUMMER_CRASH_L
    event: crash_left
    file: drummer_hit_crash_left.png
    target_components:
      - left_crash_cymbal
    moving_components:
      - left_arm_high_contact_pose
      - left_stick_touching_left_crash
      - left_crash_contact_glow
      - cymbal_ring_halo
    decay_ms: 450
    shimmer_ms: 450

  - id: DRUMMER_CRASH_R
    event: crash_right
    file: drummer_hit_crash_right.png
    target_components:
      - right_crash_cymbal
    moving_components:
      - right_arm_high_contact_pose
      - right_stick_touching_right_crash
      - right_crash_contact_glow
      - cymbal_ring_halo
    decay_ms: 450
    shimmer_ms: 450
