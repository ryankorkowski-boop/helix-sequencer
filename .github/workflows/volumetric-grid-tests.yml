name: Volumetric Grid Prototype Tests

on:
  push:
    branches:
      - feature/volumetric-grid-birdsong-20261101
  pull_request:
    paths:
      - 'core/volumetric_grid.py'
      - 'core/birdsong_volumetric_adapter.py'
      - 'tests/test_volumetric_grid.py'
      - 'tests/test_birdsong_volumetric_adapter.py'\n      - 'core/volumetric_preview.py'\n      - 'tests/test_volumetric_preview.py'
      - '.github/workflows/volumetric-grid-tests.yml'
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run focused tests and Birdsong regression
        run: PYTHONPATH=. python -m pytest -q tests/test_volumetric_grid.py tests/test_birdsong_volumetric_adapter.py tests/test_volumetric_preview.py tests/test_birdsong_issue2_runtime.py
