name: Volumetric Grid Prototype Tests

on:
  push:
    branches:
      - feature/volumetric-grid-birdsong-20261101
  pull_request:
    paths:
      - 'core/volumetric_grid.py'
      - 'core/birdsong_volumetric_adapter.py'
      - 'tests/test_volumetric_grid.py'
      - 'tests/test_birdsong_volumetric_adapter.py'\n      - 'core/volumetric_preview.py'\n      - 'tests/test_volumetric_preview.py'
      - 'core/volumetric_address_map.py'
      - 'tests/test_volumetric_address_map.py'
      - 'tools/volumetric_demo.py'
      - 'tests/test_volumetric_demo.py'
      - '.github/workflows/volumetric-grid-tests.yml'
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run focused tests and Birdsong regression
        run: PYTHONPATH=. python -m pytest -q tests/test_volumetric_grid.py tests/test_birdsong_volumetric_adapter.py tests/test_volumetric_preview.py tests/test_volumetric_address_map.py tests/test_volumetric_demo.py tests/test_birdsong_issue2_runtime.py
      - name: Generate small-grid Birdsong proof artifacts
        run: PYTHONPATH=. python -m tools.volumetric_demo --output-dir evidence/volumetric_demo
      - name: Verify demo artifact counts
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("evidence/volumetric_demo")
          receipt = json.loads((root / "receipt.json").read_text())
          assert receipt["cue_count"] > 0
          with (root / "addresses.csv").open(newline="") as f:
              assert sum(1 for _ in csv.DictReader(f)) == receipt["pixel_count"]
          assert (root / "frame_1000ms.jsonl").stat().st_size > 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volumetric-small-grid-engineering-preview
          path: evidence/volumetric_demo/
          if-no-files-found: warn
