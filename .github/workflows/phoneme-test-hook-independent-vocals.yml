name: Phoneme Test Hook - independent vocal routing
on:
  workflow_dispatch:
  push:
    branches: [integration/unified-beta-completion-20261117]
    paths:
      - core/vocal_timeline.py
      - core/independent_vocals.py
      - core/vocal_separation_manifest.py
      - tests/test_phoneme_hook_harmony_routing.py
      - tests/test_separate_vocal_roles.py
      - tools/separate_vocal_roles.py
      - tests/test_verify_shared_approval_source.py
      - tools/verify_shared_approval_source.py
      - tests/test_independent_vocals.py
      - tests/test_vocal_separation_manifest.py
      - .github/workflows/phoneme-test-hook-independent-vocals.yml
permissions:
  contents: read
jobs:
  phoneme-test-hook:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test requirements
        run: python -m pip install pytest
      - name: Verify independent singer and phoneme routing gates
        run: python -m pytest -q tests/test_phoneme_hook_harmony_routing.py tests/test_separate_vocal_roles.py tests/test_independent_vocals.py tests/test_vocal_separation_manifest.py tests/test_verify_shared_approval_source.py
