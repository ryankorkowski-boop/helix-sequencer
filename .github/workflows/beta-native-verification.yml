name: Helix Beta native output verification
on:
  push:
    branches: [validation/beta-native-20261014]
permissions:
  contents: read
jobs:
  native-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      XL_NO_GPU_COMPUTE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: validation
      - uses: actions/checkout@v4
        with:
          path: source
          ref: 2b295284ae2c0d33fc40e8c3d54a9dbea0677fcc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth ffmpeg libgtk-3-0t64 libgl1 libegl1 libegl-mesa0 libopengl0 libglu1-mesa libgstreamer-plugins-base1.0-0
          python -m pip install numpy pillow zstandard
          mkdir -p "$RUNNER_TEMP/xlights-native"
          cd "$RUNNER_TEMP/xlights-native"
          curl --fail --location --retry 3 --output xLights.AppImage https://github.com/xLightsSequencer/xLights/releases/download/2026.18/xLights-2026.18-x86_64.AppImage
          echo '62affb88b9a9b03cf5164974ac69bcefe35c559719d157b3364e4d4a5ab4214b  xLights.AppImage' | sha256sum --check
          chmod +x xLights.AppImage
          ./xLights.AppImage --appimage-extract >/dev/null
      - name: Native 1081-model import, rung notes and physical circuit timing
        working-directory: source
        run: |
          xvfb-run -a python ../validation/validation/beta_native_proof.py --xlights "$RUNNER_TEMP/xlights-native/squashfs-root/AppRun" --output "$GITHUB_WORKSPACE/native-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Helix-Beta-Native-Verification
          path: native-proof/
          if-no-files-found: error
          retention-days: 30
