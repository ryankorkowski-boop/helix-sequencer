name: Recover compact verified native renderer
on:
  push:
    branches: [codex/pr188-native-runtime-20261024]
    paths: [.github/workflows/pr188-native-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify retained producer
        uses: actions/github-script@v7
        with:
          script: |
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:39511779105});
            if(r.head_sha!=='aa00b873e484f9930b71afbe9504c27dcb7f4249'||r.conclusion!=='success'||r.path!=='.github/workflows/fresh-real-band-mp4.yml') throw Error('Retained producer identity mismatch');
      - uses: actions/download-artifact@v4
        with:
          name: helix-native-build-ubuntu24-x64-2026.18-18596d7ef1ae45292cc2b2f14a66241371b5561ac6556bf6aedef74d19c1a6a9
          run-id: 39511779105
          github-token: ${{ github.token }}
          path: retained-build
      - name: Verify and compact existing build
        run: |
          python -m tools.native_renderer_bundle restore --patch tools/patch_xlights_native_export.py --root "$RUNNER_TEMP/xlights-src" --bundle retained-build
          mkdir compact-runtime
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/xLights.AppImage" https://github.com/xLightsSequencer/xLights/releases/download/2026.18/xLights-2026.18-x86_64.AppImage
          echo '62affb88b9a9b03cf5164974ac69bcefe35c559719d157b3364e4d4a5ab4214b  '"$RUNNER_TEMP/xLights.AppImage" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/xLights.AppImage"
          (cd compact-runtime && "$RUNNER_TEMP/xLights.AppImage" --appimage-extract >/dev/null)
          cp retained-build/renderer.json compact-runtime/origin-renderer.json
          cp "$RUNNER_TEMP/xlights-src/bin/xLights" compact-runtime/squashfs-root/usr/bin/xLights
          strip compact-runtime/squashfs-root/usr/bin/xLights
          cp -a "$RUNNER_TEMP/xlights-src/wxWidgets-xlights_2026.17c/lib/"libwx*.so* compact-runtime/squashfs-root/usr/lib/
          cp tools/patch_xlights_native_export.py compact-runtime/
          (cd compact-runtime && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -C compact-runtime -czf helix-native-runtime-2026.18.tar.gz .
          sha256sum helix-native-runtime-2026.18.tar.gz > helix-native-runtime-2026.18.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: helix-verified-compact-native-runtime
          path: |
            helix-native-runtime-2026.18.tar.gz
            helix-native-runtime-2026.18.sha256
          retention-days: 14
          if-no-files-found: error
