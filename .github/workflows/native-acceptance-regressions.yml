name: Native band acceptance regressions
on:
  push:
    branches: [work/native-acceptance-evidence-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy zstandard pytest pyyaml
      - name: Verify startup and real artifact acceptance regressions
        run: |
          python -m unittest discover -s tests -p test_native_preview_resolution.py -v
          python -m pytest tests/test_native_band_artifact.py tests/test_native_band_stage_and_vocals.py -q
          python -m compileall -q tools/native_preview.py tools/native_source_pose_band.py tools/verify_native_band_artifact.py
          python - <<'PY'
          import yaml
          for name in ('fresh-real-band-mp4.yml', 'beta-completion-native.yml'):
              with open('.github/workflows/' + name) as source:
                  value = yaml.safe_load(source)
              assert isinstance(value['jobs'], dict)
          PY
