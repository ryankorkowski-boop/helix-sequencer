name: Showcase quality gates
on:
  push:
    branches:
      - 'codex/showcase-quality-gates-*'
    paths:
      - 'tools/validate_showcase*.py'
      - 'tests/test_validate_showcase*.py'
      - '.github/workflows/showcase-quality-gates.yml'
  pull_request:
    paths:
      - 'tools/validate_showcase*.py'
      - 'tests/test_validate_showcase*.py'
      - '.github/workflows/showcase-quality-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  showcase-validator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and test runner
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install pytest
      - name: Compile showcase scripts
        run: python -m compileall -q tools/validate_showcase_mp4.py tools/validate_showcase_batch.py tools/validate_showcase_manifest.py
      - name: Run focused regression suite
        run: python -m pytest -q tests/test_validate_showcase_mp4.py tests/test_validate_showcase_mp4_edge_cases.py tests/test_validate_showcase_batch.py tests/test_validate_showcase_batch_edge_cases.py
      - name: Reject missing showcase media
        run: |
          if python tools/validate_showcase_mp4.py /tmp/helix-missing-showcase.mp4; then
            echo 'Missing media was incorrectly accepted'
            exit 1
          fi
