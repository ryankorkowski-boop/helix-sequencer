name: Beta 1.3 versus current native A-B pilot
on:
  push:
    branches: [test/beta13-vocals-ab-20261125]
    paths: [.github/workflows/beta13-current-ab.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: beta13-current-ab-pilot
  cancel-in-progress: false
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HELIX_SOURCE_COMMIT: '67bc599499041b6d47ba07c9c5c2158699aad24a'
      HELIX_NATIVE_PREVIEW_WIDTH: '1920'
      HELIX_NATIVE_PREVIEW_HEIGHT: '1080'
      XL_NO_GPU_COMPUTE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HELIX_DEMUCS_DEVICE: cpu
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '67bc599499041b6d47ba07c9c5c2158699aad24a'
      - uses: actions/checkout@v4
        with:
          ref: '7d4beb8f9f5799a5c0ce23bbaa3a87eee8912a10'
          path: ab-baseline
      - name: Isolate original engine checkout
        run: mv ab-baseline "$RUNNER_TEMP/ab-baseline"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve checksum verified owner source
        run: python -m tools.phoneme_source phoneme-work/input
      - name: Install native rendering and engine dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb xauth openbox x11-utils x11-xserver-utils wmctrl xdotool libgtk-3-0t64 libgl1 libegl1 libopengl0 libglu1-mesa libgstreamer-plugins-base1.0-0
          python -m pip install scipy scikit-learn Pillow trimesh moderngl zstandard imageio imageio-ffmpeg cmudict PyYAML requests pytest
      - name: Separate verified source using production audio environment
        uses: ./.github/actions/production-audio
        with:
          audio: phoneme-work/input/Phoneme_Test_Hook.mp3
          sha256: 19e90c273d0d747938f24b36586b50818c104cddffbefe4a4128927374301938
      - name: Test backported source separation components
        working-directory: ${{ runner.temp }}/ab-baseline
        run: python -m pytest -q tests/test_independent_vocals.py tests/test_vocal_separation_manifest.py tests/test_separate_vocal_roles.py
      - name: Prepare identical native band layout and common separated vocal estimates with both actual engines
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('tools/prepare_phoneme_show.py')
          s = p.read_text()
          s = s.replace('import argparse\n', 'import argparse\nimport os\n')
          s = s.replace('    commit = subprocess.check_output', '    engine_root = Path(os.environ.get("HELIX_AB_ENGINE_ROOT", str(ROOT))).resolve()\n    commit = subprocess.check_output', 1)
          s = s.replace("cwd=ROOT, text=True).strip()", "cwd=engine_root, text=True).strip()", 1)
          s = s.replace("str(ROOT / 'main.py')", "str(engine_root / 'main.py')", 1)
          s = s.replace("subprocess.run(command, cwd=ROOT,", "subprocess.run(command, cwd=engine_root,", 1)
          p.write_text(s)
          PY
          set +e
          HELIX_AB_ENGINE_ROOT="$RUNNER_TEMP/ab-baseline" python -m tools.prepare_phoneme_show --audio phoneme-work/input/Phoneme_Test_Hook.mp3 --output phoneme-work/A
          a=$?
          python -m tools.prepare_phoneme_show --audio phoneme-work/input/Phoneme_Test_Hook.mp3 --output phoneme-work/B
          b=$?
          printf 'A=%s B=%s\n' "$a" "$b" | tee phoneme-work/engine-exits.txt
          find phoneme-work -name sequencer.log -exec tail -n 60 {} \;
          test "$a" = 0 && test "$b" = 0
      - name: Restore compiled pinned native renderer
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xlights-src
          key: xlights-native-ubuntu24-2026.18-${{ hashFiles('tools/patch_xlights_native_export.py') }}
          restore-keys: xlights-native-ubuntu24-2026.18-
      - name: Restore proven renderer bundle after a cache miss
        id: retained-native
        if: steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: helix-native-build-ubuntu24-x64-2026.18-18596d7ef1ae45292cc2b2f14a66241371b5561ac6556bf6aedef74d19c1a6a9
          run-id: 39511779105
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-renderer-bundle
      - name: Verify retained upstream, source patch and executable before use
        id: retained-native-verify
        if: steps.retained-native.outcome == 'success'
        continue-on-error: true # A prior-patch bundle is not usable; rebuild below.
        run: python -m tools.native_renderer_bundle restore --patch tools/patch_xlights_native_export.py --root "$RUNNER_TEMP/xlights-src" --bundle "$RUNNER_TEMP/native-renderer-bundle"
      - name: Install checksum pinned native xLights
        run: |
          mkdir -p "$RUNNER_TEMP/xlights"
          cd "$RUNNER_TEMP/xlights"
          curl -fLsS --retry 3 -o xLights.AppImage https://github.com/xLightsSequencer/xLights/releases/download/2026.18/xLights-2026.18-x86_64.AppImage
          echo '62affb88b9a9b03cf5164974ac69bcefe35c559719d157b3364e4d4a5ab4214b  xLights.AppImage' | sha256sum -c -
          chmod +x xLights.AppImage
          ./xLights.AppImage --appimage-extract >/dev/null
          # Compile the source-level native export fix; never claim that the
          # unmodified release AppImage honors requested export dimensions.
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            freeglut3-dev libavcodec-dev libavformat-dev libavfilter-dev \
            libswscale-dev libsdl2-dev libzstd-dev libcurl4-openssl-dev \
            liblua5.3-dev libwebp-dev libsecret-1-dev libegl-dev \
            libfreetype-dev libharfbuzz-dev libfontconfig-dev \
            libavahi-compat-libdnssd-dev libminizip-dev libxlsxwriter-dev \
            cbp2make glslc glslang-dev
          if [ ! -d "$RUNNER_TEMP/xlights-src/.git" ]; then
            git clone --depth 1 --branch 2026.18 --recurse-submodules \
              https://github.com/xLightsSequencer/xLights.git "$RUNNER_TEMP/xlights-src"
          fi
          cd "$RUNNER_TEMP/xlights-src"
          test "$(git rev-parse HEAD)" = 839c0f590dc454bb7adb8a16c4dd92a70b46156e
          # make installs wxWidgets under /usr, outside the cached source tree.
          # A cache hit on a fresh runner must restore that installation too;
          # an executable xLights file alone does not prove a usable runtime.
          if [ -f wxWidgets-xlights_2026.17c/lib/libwx_gtk3u-3.3.so.4.0.0 ]; then
            sudo make -C wxWidgets-xlights_2026.17c install
            sudo ldconfig
          fi
          # A restore-key cache may contain the previous source patch. Never
          # infer current renderer compatibility from an executable alone.
          if python -c "from pathlib import Path; import sys; sys.path.insert(0, '$GITHUB_WORKSPACE'); from tools.native_renderer_bundle import validate_tree; validate_tree(Path.cwd())"; then
            echo "HELIX_PATCHED_XLIGHTS=$RUNNER_TEMP/xlights-src/bin/xLights" >> "$GITHUB_ENV"
            exit 0
          fi
          # Reuse previous object files, but restore only our two pinned source
          # sites before applying this revision's verified native patch.
          git checkout -- src-ui-wx/xLightsMain.cpp src-ui-wx/app-shell/TabSequence.cpp src-ui-wx/graphics/opengl/xlGLCanvas.cpp src-ui-wx/graphics/opengl/xlGLCanvas.h src-ui-wx/graphics/vulkan/xlVulkanCanvas.cpp
          python "$GITHUB_WORKSPACE/tools/patch_xlights_native_export.py" "$RUNNER_TEMP/xlights-src"
          # Capture actionable compiler errors even when GitHub's live job logs
          # are unavailable, and cap a stalled compile before job timeout.
          set -o pipefail
          # Allow the pinned native build to finish within the job's 60-minute limit.
          # The previous 35-minute cap terminated compilation before rendering began.
          timeout --signal=TERM --kill-after=30s 48m make -j 4 2>&1 | tee "$GITHUB_WORKSPACE/xlights-native-build.log"
          test -x bin/xLights
          echo "HELIX_PATCHED_XLIGHTS=$RUNNER_TEMP/xlights-src/bin/xLights" >> "$GITHUB_ENV"
      - name: Validate restored native runtime dependencies
        run: |
          ldd "$HELIX_PATCHED_XLIGHTS" | tee native-runtime-libraries.log
          python - <<'PY'
          from pathlib import Path
          report = Path('native-runtime-libraries.log').read_text()
          if 'not found' in report:
              raise SystemExit('Native renderer has unresolved shared libraries; see native-runtime-libraries.log')
          PY
      - name: Preserve completed native build before export acceptance
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/xlights-src
          key: xlights-native-ubuntu24-2026.18-${{ hashFiles('tools/patch_xlights_native_export.py') }}
      - name: Native render both lanes with one renderer
        run: |
          set -euo pipefail
          for lane in A B; do
            export lane
            xvfb-run -a -s '-screen 0 2560x1440x24' sh -c 'openbox >/tmp/ab-openbox.log 2>&1 & exec python -m tools.native_preview "phoneme-work/$lane" --xsq "phoneme-work/$lane/Phoneme_Test_Hook_Helix.xsq" --audio "phoneme-work/$lane/media/Phoneme_Test_Hook.mp3" --xlights "$HELIX_PATCHED_XLIGHTS"'
          done
      - name: Compose side by side with one soundtrack and decode every frame
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from tools.phoneme_source import digest
          root=Path('phoneme-work')
          videos=[]
          for lane in ['A','B']:
              report=json.loads((root/lane/'run_manifest.json').read_text())
              native=report.get('native_preview',{})
              assert native.get('status')=='success', (lane,native)
              video=Path(native['mp4'])
              assert video.is_file() and digest(video)==native['mp4_sha256']
              videos.append(video)
          audio=root/'input/Phoneme_Test_Hook.mp3'
          out=root/'Beta13_vs_Current_30s.mp4'
          filters="[0:v]scale=960:540,pad=960:1080:0:270,drawtext=text='A - Beta 1.3 + shared vocals':fontsize=26:fontcolor=white:x=20:y=220[a];[1:v]scale=960:540,pad=960:1080:0:270,drawtext=text='B - Current + shared vocals':fontsize=26:fontcolor=white:x=20:y=220[b];[a][b]hstack=inputs=2[v]"
          subprocess.run(['ffmpeg','-y','-v','error','-i',str(videos[0]),'-i',str(videos[1]),'-i',str(audio),'-filter_complex',filters,'-map','[v]','-map','2:a:0','-t','30','-r','30','-c:v','libx264','-pix_fmt','yuv420p','-c:a','aac','-movflags','+faststart',str(out)],check=True)
          subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(out),'-f','null','-'],check=True)
          (root/'AB_SCOPE.json').write_text(json.dumps({'A':'7d4beb8f9f5799a5c0ce23bbaa3a87eee8912a10','B':'67bc599499041b6d47ba07c9c5c2158699aad24a','scope':'single native six-performer band pilot, common current geometry/export adapter; not full panel acceptance','independent_singer_identity_verified':False,'vocal_mode':'same source-separated acoustic estimates, not qualified independent singers','owner_approved':False,'video_sha256':digest(out)},indent=2))
          PY
      - name: Preserve comparison and original native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Beta13-current-AB-pilot
          path: |
            phoneme-work/
            xlights-native-build.log
            native-runtime-libraries.log
          if-no-files-found: warn
