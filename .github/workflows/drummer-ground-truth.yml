name: Drummer Ground Truth Test

# Ground truth for the current eight-component drummer contract. Three toms:
# High, Mid, Floor. Contacting sticks are geometry inside each hit component.
on:
  push:
    branches:
      - feature/restructure-core
    paths:
      - '.github/workflows/drummer-ground-truth.yml'
      - 'animation/drummer_motion.py'
      - 'mapping/drum_mapper.py'
      - 'fixtures/band_geometry/**'
      - 'tools/**'
      - 'tests/**'
      - 'run_drummer_v3_test.py'
  workflow_dispatch:

jobs:
  drummer-ground-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pillow numpy scipy scikit-learn librosa soundfile numba llvmlite imageio imageio-ffmpeg PyYAML
      - name: Generate deterministic ground-truth drum audio
        run: python tools/generate_drummer_ground_truth.py --wav test_runs/drummer_ground_truth/drummer_ground_truth.wav --events test_runs/drummer_ground_truth/events.json
      - name: Export deterministic 8-lane drummer truth XSQ
        env:
          PYTHONPATH: .
          HELIX_DURATION: '20'
        run: python tools/export_drummer_ground_truth_xsq.py --output test_runs/drummer_ground_truth/HelixDrummerGroundTruth_8lane.xsq --duration 20
      - name: Verify XSQ has exactly eight logical components and no fourth tom
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('test_runs/drummer_ground_truth/HelixDrummerGroundTruth_8lane.xsq')
          root=ET.parse(p).getroot()
          expected={'KICK','SNARE','HI_HAT','TOM_HIGH','TOM_MID','TOM_FLOOR','CYMBAL_LEFT','CYMBAL_RIGHT'}
          channels=set(root.find('./timingtrack').get('channels','').split(','))
          if root.get('drummerChannels') != '8' or channels != expected:
              raise SystemExit(f'FAIL: expected 8 drummer components, got {sorted(channels)}')
          if any('STICK' in name.upper() or 'ARM' in name.upper() or 'TOM_4' in name.upper() for name in channels):
              raise SystemExit(f'FAIL: invalid drummer target leaked into contract: {sorted(channels)}')
          print('PASS: exactly 8 logical components: kick/snare/hi-hat/high/mid/floor/left-cymbal/right-cymbal')
          PY
      - name: Run drummer unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_drummer_layers.py tests/test_drummer_xmodel_asset.py tests/test_drummer_v3_pose_sheet.py tests/test_drummer_v3_png_layers.py tests/test_finished_helixville4_drummer.py tests/test_drummer_v3_xsq_integration.py
      - name: Render the actual drummer XSQ preview
        env:
          PYTHONPATH: .
        run: |
          mkdir -p test_runs/drummer_ground_truth/preview
          python -m tools.render_xsq_skeleton_preview \
            test_runs/drummer_ground_truth/HelixDrummerGroundTruth_8lane.xsq \
            --width 1280 --height 720 --fps 24 \
            --audio test_runs/drummer_ground_truth/drummer_ground_truth.wav
          mv test_runs/drummer_ground_truth/HelixDrummerGroundTruth_8lane.mp4 test_runs/drummer_ground_truth/preview/drummer-ground-truth.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.render_xsq_skeleton_preview import parse_preview_effects
          xsq=Path('test_runs/drummer_ground_truth/HelixDrummerGroundTruth_8lane.xsq')
          mp4=Path('test_runs/drummer_ground_truth/preview/drummer-ground-truth.mp4')
          effects=parse_preview_effects(xsq)
          models=sorted({effect.model for effect in effects})
          meta=Path('test_runs/drummer_ground_truth/preview/helix_flow_preview_metadata.json')
          meta.write_text(json.dumps({'mp4':str(mp4),'xsq':str(xsq),'audio_muxed':True,'audio':'test_runs/drummer_ground_truth/drummer_ground_truth.wav','visible_effect_count':len(effects),'visual_model_count':len(models),'visual_models':models,'renderer':'tools/render_xsq_skeleton_preview.py','renderer_mode':'drummer_ground_truth'},indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(f'PASS: rendered actual drummer XSQ with {len(effects)} visible effects across {len(models)} visual models')
          PY
      - name: Verify preview contains visual drummer effects
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('test_runs/drummer_ground_truth/preview/helix_flow_preview_metadata.json')
          d=json.loads(p.read_text())
          if d.get('visible_effect_count',0) <= 0: raise SystemExit('FAIL: no visible effects')
          if d.get('visual_model_count',0) <= 1: raise SystemExit(f'FAIL: expected multiple visual models, got {d.get("visual_models",[])}')
          if not Path(d['mp4']).exists(): raise SystemExit('FAIL: drummer MP4 was not created')
          print('PASS: actual drummer XSQ produced a playable MP4 preview')
          PY
      - name: Upload drummer XSQ artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drummer-ground-truth-xsq
          path: |
            test_runs/drummer_ground_truth/HelixDrummerGroundTruth_8lane.xsq
            test_runs/drummer_ground_truth/events.json
            test_runs/drummer_ground_truth/drummer_ground_truth.wav
          if-no-files-found: error
      - name: Upload drummer MP4 preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drummer-ground-truth-mp4
          path: test_runs/drummer_ground_truth/preview/drummer-ground-truth.mp4
          if-no-files-found: error
      - name: Upload drummer preview metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drummer-ground-truth-preview-metadata
          path: test_runs/drummer_ground_truth/preview/helix_flow_preview_metadata.json
          if-no-files-found: error
