name: Drummer Ground Truth Test

# Ground truth for the current eight-component drummer contract. Three toms:
# High, Mid, Floor. Contacting sticks are geometry inside each hit component.
on:
  push:
    branches:
      - feature/restructure-core
    paths:
      - '.github/workflows/drummer-ground-truth.yml'
      - 'animation/drummer_motion.py'
      - 'mapping/drum_mapper.py'
      - 'fixtures/band_geometry/**'
      - 'tools/**'
      - 'tests/**'
      - 'run_drummer_v3_test.py'
  workflow_dispatch:

jobs:
  drummer-ground-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pillow numpy scipy scikit-learn librosa soundfile numba llvmlite imageio imageio-ffmpeg PyYAML
      - name: Regenerate canonical V3 drummer assets from the authored ground truth
        env:
          PYTHONPATH: .
        run: |
          python tools/build_drummer_v3_assets.py --overwrite
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('fixtures/band_geometry/models/HX_SNOWMAN_DRUMMER_V3.xmodel')
          root = ET.parse(path).getroot()
          width = int(root.get('parm1', '96'))
          expected = {
              'HX_SNOWMAN_DRUMMER_V3_TOM_HIGH': 'left/upper',
              'HX_SNOWMAN_DRUMMER_V3_TOM_MID': 'right/upper',
              'HX_SNOWMAN_DRUMMER_V3_TOM_FLOOR': 'left/lower',
          }
          centroids = {}
          for sm in root.findall('./subModels/subModel'):
              name = sm.get('name')
              if name not in expected:
                  continue
              xs=[]; ys=[]
              for token in sm.get('line0','').split(','):
                  m=re.fullmatch(r'(\d+)(?:-(\d+))?', token)
                  if not m: raise SystemExit(f'FAIL: malformed node range: {token}')
                  a=int(m.group(1)); b=int(m.group(2) or m.group(1))
                  for node in range(a,b+1):
                      idx=node-1; xs.append(idx % width); ys.append(idx // width)
              centroids[name]=(sum(xs)/len(xs),sum(ys)/len(ys))
          if set(centroids) != set(expected):
              raise SystemExit(f'FAIL: missing canonical toms: {sorted(set(expected)-set(centroids))}')
          high=centroids['HX_SNOWMAN_DRUMMER_V3_TOM_HIGH']
          mid=centroids['HX_SNOWMAN_DRUMMER_V3_TOM_MID']
          floor=centroids['HX_SNOWMAN_DRUMMER_V3_TOM_FLOOR']
          if not (high[0] < 48 and mid[0] > 48 and floor[0] < 48):
              raise SystemExit(f'FAIL: V3 tom geometry not grounded: HIGH={high} MID={mid} FLOOR={floor}')
          if not (floor[1] > high[1] and floor[1] > mid[1]):
              raise SystemExit(f'FAIL: V3 floor tom is not below the upper toms: HIGH={high} MID={mid} FLOOR={floor}')
          print(f'PASS: regenerated canonical V3 tom geometry HIGH={high} MID={mid} FLOOR={floor}')
          PY
      - name: Generate deterministic ground-truth drum audio
        run: python tools/generate_drummer_ground_truth.py --wav test_runs/drummer_ground_truth/drummer_ground_truth.wav --events test_runs/drummer_ground_truth/events.json
      - name: Export deterministic 8-lane drummer truth XSQ using canonical xmodel zones
        env:
          PYTHONPATH: .
          HELIX_DURATION: '20'
        run: python tools/export_drummer_ground_truth_xsq.py --output test_runs/drummer_ground_truth/HelixDrummerGroundTruth_8lane.xsq --duration 20
      - name: Verify XSQ has exactly eight logical components and canonical physical targets
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('test_runs/drummer_ground_truth/HelixDrummerGroundTruth_8lane.xsq')
          root=ET.parse(p).getroot()
          expected={'KICK','SNARE','HI_HAT','TOM_HIGH','TOM_MID','TOM_FLOOR','CYMBAL_LEFT','CYMBAL_RIGHT'}
          channels=set(root.find('./timingtrack').get('channels','').split(','))
          expected_models={
              'HX_SNOWMAN_DRUMMER_V3_KICK','HX_SNOWMAN_DRUMMER_V3_SNARE','HX_SNOWMAN_DRUMMER_V3_HI_HAT',
              'HX_SNOWMAN_DRUMMER_V3_TOM_HIGH','HX_SNOWMAN_DRUMMER_V3_TOM_MID','HX_SNOWMAN_DRUMMER_V3_TOM_FLOOR',
              'HX_SNOWMAN_DRUMMER_V3_CYMBAL_LEFT','HX_SNOWMAN_DRUMMER_V3_CYMBAL_RIGHT'}
          models={e.get('name') for e in root.findall('./ElementEffects/Element')}
          if root.get('drummerChannels') != '8' or channels != expected:
              raise SystemExit(f'FAIL: expected 8 drummer components, got {sorted(channels)}')
          if models != expected_models:
              raise SystemExit(f'FAIL: non-canonical physical targets: {sorted(models)}')
          if any('TOM_LEFT' in name or 'TOM_RIGHT' in name or 'TOM_4' in name for name in models):
              raise SystemExit(f'FAIL: legacy/extra tom target leaked into canonical XSQ: {sorted(models)}')
          print('PASS: logical 8-lane contract maps directly to canonical High/Mid/Floor xmodel zones')
          PY
      - name: Run drummer unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_drummer_layers.py tests/test_drummer_xmodel_asset.py tests/test_drummer_v3_pose_sheet.py tests/test_drummer_v3_png_layers.py tests/test_finished_helixville4_drummer.py tests/test_drummer_v3_xsq_integration.py
      - name: Render canonical drummer preview from canonical xmodel targets
        env:
          PYTHONPATH: .
        run: |
          mkdir -p test_runs/drummer_ground_truth/preview
          python tools/render_drummer_v3_preview.py \
            test_runs/drummer_ground_truth/HelixDrummerGroundTruth_8lane.xsq \
            --audio test_runs/drummer_ground_truth/drummer_ground_truth.wav \
            --output test_runs/drummer_ground_truth/preview/drummer-ground-truth.mp4 \
            --fps 24
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          xsq=Path('test_runs/drummer_ground_truth/HelixDrummerGroundTruth_8lane.xsq')
          mp4=Path('test_runs/drummer_ground_truth/preview/drummer-ground-truth.mp4')
          root=ET.parse(xsq).getroot()
          models=sorted(e.get('name') for e in root.findall('./ElementEffects/Element'))
          effects=sum(len(layer.findall('Effect')) for element in root.findall('./ElementEffects/Element') for layer in element.findall('EffectLayer'))
          meta=Path('test_runs/drummer_ground_truth/preview/helix_flow_preview_metadata.json')
          meta.write_text(json.dumps({'mp4':str(mp4),'xsq':str(xsq),'audio_muxed':True,'audio':'test_runs/drummer_ground_truth/drummer_ground_truth.wav','visible_effect_count':effects,'visual_model_count':len(models),'visual_models':models,'renderer':'tools/render_drummer_v3_preview.py','renderer_mode':'canonical_xmodel','tom_contract':'HIGH_MID_FLOOR'},indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(f'PASS: rendered canonical drummer xmodel targets with {effects} effects across {len(models)} components')
          PY
      - name: Verify canonical preview contains all eight visual components
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('test_runs/drummer_ground_truth/preview/helix_flow_preview_metadata.json')
          d=json.loads(p.read_text())
          required={
              'HX_SNOWMAN_DRUMMER_V3_KICK','HX_SNOWMAN_DRUMMER_V3_SNARE','HX_SNOWMAN_DRUMMER_V3_HI_HAT',
              'HX_SNOWMAN_DRUMMER_V3_TOM_HIGH','HX_SNOWMAN_DRUMMER_V3_TOM_MID','HX_SNOWMAN_DRUMMER_V3_TOM_FLOOR',
              'HX_SNOWMAN_DRUMMER_V3_CYMBAL_LEFT','HX_SNOWMAN_DRUMMER_V3_CYMBAL_RIGHT'}
          if d.get('visible_effect_count',0) <= 0: raise SystemExit('FAIL: no visible effects')
          if set(d.get('visual_models',[])) != required: raise SystemExit(f'FAIL: canonical component set mismatch: {d.get("visual_models",[])}')
          if not Path(d['mp4']).exists(): raise SystemExit('FAIL: canonical drummer MP4 was not created')
          print('PASS: canonical drummer MP4 contains exactly the eight expected visual components')
          PY
      - name: Upload drummer XSQ artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drummer-ground-truth-xsq
          path: |
            test_runs/drummer_ground_truth/HelixDrummerGroundTruth_8lane.xsq
            test_runs/drummer_ground_truth/events.json
            test_runs/drummer_ground_truth/drummer_ground_truth.wav
          if-no-files-found: error
      - name: Upload canonical drummer MP4 preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drummer-ground-truth-mp4
          path: test_runs/drummer_ground_truth/preview/drummer-ground-truth.mp4
          if-no-files-found: error
      - name: Upload drummer preview metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drummer-ground-truth-preview-metadata
          path: test_runs/drummer_ground_truth/preview/helix_flow_preview_metadata.json
          if-no-files-found: error
