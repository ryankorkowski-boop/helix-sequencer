name: Drummer Ground Truth Test

# Ground truth for the current eight-component drummer contract. Three toms:
# High, Mid, Floor. Contacting sticks are geometry inside each hit component.
on:
  push:
    branches:
      - feature/restructure-core
    paths:
      - '.github/workflows/drummer-ground-truth.yml'
      - 'animation/drummer_motion.py'
      - 'mapping/drum_mapper.py'
      - 'fixtures/band_geometry/**'
      - 'tools/**'
      - 'tests/**'
      - 'run_drummer_v3_test.py'
  workflow_dispatch:

jobs:
  drummer-ground-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pillow numpy scipy scikit-learn librosa soundfile numba llvmlite imageio imageio-ffmpeg PyYAML
      - name: Generate deterministic ground-truth drum audio
        run: python tools/generate_drummer_ground_truth.py --wav test_runs/drummer_ground_truth/drummer_ground_truth.wav --events test_runs/drummer_ground_truth/events.json
      - name: Export deterministic 8-lane drummer truth XSQ
        env:
          PYTHONPATH: .
          HELIX_DURATION: '20'
        run: python tools/export_drummer_ground_truth_xsq.py --output test_runs/drummer_ground_truth/HelixDrummerGroundTruth_8lane.xsq --duration 20
      - name: Verify XSQ has exactly eight logical components and no fourth tom
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('test_runs/drummer_ground_truth/HelixDrummerGroundTruth_8lane.xsq')
          root=ET.parse(p).getroot()
          expected={'KICK','SNARE','HI_HAT','TOM_HIGH','TOM_MID','TOM_FLOOR','CYMBAL_LEFT','CYMBAL_RIGHT'}
          channels=set(root.find('./timingtrack').get('channels','').split(','))
          if root.get('drummerChannels') != '8' or channels != expected:
              raise SystemExit(f'FAIL: expected 8 drummer components, got {sorted(channels)}')
          if any('STICK' in name.upper() or 'ARM' in name.upper() or 'TOM_4' in name.upper() for name in channels):
              raise SystemExit(f'FAIL: invalid drummer target leaked into contract: {sorted(channels)}')
          print('PASS: exactly 8 logical components: kick/snare/hi-hat/high/mid/floor/left-cymbal/right-cymbal')
          PY
      - name: Run drummer unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_drummer_layers.py tests/test_drummer_xmodel_asset.py tests/test_drummer_v3_pose_sheet.py tests/test_drummer_v3_png_layers.py tests/test_finished_helixville4_drummer.py tests/test_drummer_v3_xsq_integration.py
      - name: Run audio-driven drummer preview
        run: python -m tools.export_helix_flow_review_artifacts --output-dir test_runs/drummer_ground_truth/preview --duration-seconds 12 --step-seconds 0.125 --bpm 120 --audio test_runs/drummer_ground_truth/drummer_ground_truth.wav
      - name: Verify preview contains visual drummer effects
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('test_runs/drummer_ground_truth/preview/helix_flow_preview_metadata.json')
          d=json.loads(p.read_text())
          if d.get('visible_effect_count',0) <= 0: raise SystemExit('FAIL: no visible effects')
          if d.get('visual_model_count',0) <= 1: raise SystemExit(f'FAIL: expected multiple visual models, got {d.get("visual_models",[])}')
          print('PASS: multiple visual models are present in preview metadata')
          PY
      - name: Upload drummer ground-truth artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drummer-ground-truth
          path: test_runs/drummer_ground_truth/**
          if-no-files-found: error
