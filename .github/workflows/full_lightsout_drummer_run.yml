name: Full Lights Out 256 + Drummer Run
# Execution trigger: full-theme 256 + 8-channel drummer validation.
on:
  push:
    branches: [run/full-lightsout-drummer-20260813]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy librosa soundfile numba llvmlite imageio imageio-ffmpeg pillow scikit-learn
      - name: Verify full theme audio
        run: |
          test -f "Helix Audiolights.mp3"
          python - <<'PY'
          import imageio_ffmpeg, subprocess
          ff=imageio_ffmpeg.get_ffmpeg_exe()
          p=subprocess.run([ff,'-i','Helix Audiolights.mp3','-f','null','-'],capture_output=True,text=True)
          print('FULL_AUDIO_FILE_OK', p.returncode==0)
          if p.returncode: raise SystemExit(p.stderr[-2000:])
          PY
      - name: Run current legacy 256 sequencer
        env: {PYTHONPATH: .}
        run: |
          set -o pipefail
          mkdir -p test_runs/full_lightsout_drummer
          python -m core.sequence_builder --profile v28.9 -- --template template.xsq --audio "Helix Audiolights.mp3" --layout-file xlights_rgbeffects.xml --single --output-dir test_runs/full_lightsout_drummer/base256 --variants 1 --no-prompt --no-save-settings --no-workspace-history 2>&1 | tee test_runs/full_lightsout_drummer/sequence_builder.log
          xsq_count=$(find test_runs/full_lightsout_drummer/base256 -maxdepth 1 -type f -name '*.xsq' -size +0c | wc -l)
          if [ "$xsq_count" -lt 1 ]; then
            echo "ERROR: sequence_builder completed without producing a non-empty XSQ."
            echo "--- sequence_builder.log ---"
            cat test_runs/full_lightsout_drummer/sequence_builder.log
            echo "--- report candidates ---"
            find test_runs/full_lightsout_drummer -maxdepth 3 -type f | sort || true
            exit 1
          fi
          echo "SEQUENCE_BUILDER_XSQ_COUNT=$xsq_count"
      - name: Detect drums with current drummer intelligence
        env: {PYTHONPATH: .}
        run: |
          python debug/drum_debug.py "Helix Audiolights.mp3" --json test_runs/full_lightsout_drummer/drum_debug.json
      - name: Add 8-channel Drummer V3 layer
        env: {PYTHONPATH: .}
        run: |
          python - <<'PY'
          import json, shutil, xml.etree.ElementTree as ET
          from pathlib import Path
          from audio.drum_detection import detect_drum_event_streams_from_file
          from mapping.drum_mapper import resolve_drum_streams
          root=Path('test_runs/full_lightsout_drummer'); xsqs=sorted((root/'base256').glob('*.xsq'))
          if not xsqs: raise SystemExit('No generated 256-channel XSQ found')
          src=xsqs[0]; out=root/'LightsOutTheme_FULL_256_PLUS_DRUMMER_V3.xsq'; shutil.copy2(src,out)
          resolved=resolve_drum_streams(detect_drum_event_streams_from_file(Path('Helix Audiolights.mp3'))); events=resolved['events']
          channel_by_type={'kick':257,'snare':258,'hihat':259,'tom':260,'cymbal':261}
          model_names={257:'HX_DRUMMER_CH01_KICK',258:'HX_DRUMMER_CH02_SNARE',259:'HX_DRUMMER_CH03_HIHAT',260:'HX_DRUMMER_CH04_TOM',261:'HX_DRUMMER_CH05_CYMBAL',262:'HX_DRUMMER_CH06_LEFT_STICK',263:'HX_DRUMMER_CH07_RIGHT_STICK',264:'HX_DRUMMER_CH08_BODY_IMPACT'}
          layout=ET.parse('xlights_rgbeffects.xml'); lr=layout.getroot(); models=lr.find('models')
          if models is None: raise SystemExit('Layout has no models')
          existing={m.get('name') for m in models.findall('model')}; positions=[(760,230),(800,250),(840,230),(880,250),(920,230),(780,330),(860,330),(820,400)]
          for ch,name in model_names.items():
              if name in existing: continue
              x,y=positions[ch-257]
              ET.SubElement(models,'model',{'DisplayAs':'Single Line','StartSide':'B','Dir':'L','Antialias':'1','PixelSize':'4','Transparency':'0','parm1':'1','parm2':'1','parm3':'1','LayoutGroup':'DRUMMER_V3','name':name,'CustomColor':'#FFFFFF','StringType':'Single Color Intensity','WorldPosX':str(x),'WorldPosY':str(y),'WorldPosZ':'0','X2':'-10','Y2':'0','Z2':'0','versionNumber':'7','StartChannel':str(ch)})
          ET.ElementTree(lr).write(root/'xlights_rgbeffects_plus_drummer.xml',encoding='utf-8',xml_declaration=True)
          tree=ET.parse(out); xr=tree.getroot(); ee=next((n for n in xr.iter() if n.tag.endswith('ElementEffects')),None) or ET.SubElement(xr,'ElementEffects'); layers={}
          def layer(name):
              if name in layers:return layers[name]
              elem=next((e for e in ee.findall('Element') if e.get('name')==name or e.get('Name')==name),None) or ET.SubElement(ee,'Element',{'type':'model','name':name}); layers[name]=ET.SubElement(elem,'EffectLayer',{'name':'AUTO_Drummer_V3','visible':'1'}); return layers[name]
          def add(ch,s,e,v): ET.SubElement(layer(model_names[ch]),'Effect',{'name':'On','startTime':str(max(0,int(s))),'endTime':str(max(int(s)+50,int(e))),'settings':f'E_CHECKBOX_OverlayBkg=0,E_SLIDER_Brightness={min(1,max(.08,float(v))):.3f}','palette':'C_BUTTON_Palette1=#FFFFFF,C_BUTTON_Palette2=#FFFFFF,C_BUTTON_Palette3=#FFFFFF','source':'HelixDrummerV3','sourceDrumChannel':str(ch)})
          for ev in events:
              t=int(ev.timestamp_ms); d=int(70+ev.velocity*180); ch=channel_by_type.get(ev.drum_type,264); add(ch,t,t+d,ev.velocity)
              if ev.drum_type in ('snare','tom','cymbal'): add(262,t-20,t+d*.7,ev.velocity*.9)
              if ev.drum_type in ('hihat','tom','cymbal'): add(263,t-15,t+d*.7,ev.velocity*.85)
              if ev.drum_type in ('kick','snare') and ev.velocity>=.72: add(264,t,t+120,ev.velocity*.72)
          tr=ET.SubElement(xr,'timingtrack',{'name':'HelixDrummerV3'})
          for i,ev in enumerate(events): ET.SubElement(tr,'drumEvent',{'index':str(i),'type':ev.drum_type,'start':f'{ev.timestamp:.6f}','velocity':f'{ev.velocity:.4f}','confidence':f'{ev.confidence:.4f}'})
          tree.write(out,encoding='utf-8',xml_declaration=True)
          (root/'drummer_run_report.json').write_text(json.dumps({'source_xsq':str(src),'output_xsq':str(out),'drum_event_count':len(events),'fallback_mode':resolved['fallback_mode'],'drummer_channels':model_names,'preview_layout':str(root/'xlights_rgbeffects_plus_drummer.xml')},indent=2),encoding='utf-8')
          print('DRUM_EVENTS',len(events),resolved['fallback_mode'])
          PY
      - name: Render full MP4 with synchronized full theme audio
        env: {PYTHONPATH: .}
        run: |
          python -m tools.preview_renderer test_runs/full_lightsout_drummer/LightsOutTheme_FULL_256_PLUS_DRUMMER_V3.xsq --layout test_runs/full_lightsout_drummer/xlights_rgbeffects_plus_drummer.xml --audio "Helix Audiolights.mp3" --fps 10 --width 960 --height 540
      - name: Validate outputs
        run: |
          test -s test_runs/full_lightsout_drummer/LightsOutTheme_FULL_256_PLUS_DRUMMER_V3.xsq
          test -s test_runs/full_lightsout_drummer/LightsOutTheme_FULL_256_PLUS_DRUMMER_V3.mp4
          cat test_runs/full_lightsout_drummer/drummer_run_report.json
      - name: Upload full run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helix-full-lightsout-256-plus-drummer-v3
          path: |
            test_runs/full_lightsout_drummer/*.xsq
            test_runs/full_lightsout_drummer/*.mp4
            test_runs/full_lightsout_drummer/*.json
            test_runs/full_lightsout_drummer/*.xml
          if-no-files-found: warn
