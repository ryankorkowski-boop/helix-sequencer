name: Recover retained pinned native wx libraries
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: recover-native-wx-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: helix-native-build-ubuntu24-x64-2026.18-18596d7ef1ae45292cc2b2f14a66241371b5561ac6556bf6aedef74d19c1a6a9
          run-id: 39511779105
          github-token: ${{ github.token }}
          path: retained-native
      - name: Verify retained archive and extract its two actual runtime libraries
        run: python3 -m tools.extract_native_wx_runtime retained-native native-wx
      - uses: actions/upload-artifact@v4
        with:
          name: helix-pinned-native-wx-libraries
          path: native-wx/
          if-no-files-found: error
