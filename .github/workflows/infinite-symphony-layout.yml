name: Infinite Symphony 3D Layout

on:
  push:
    branches: [codex/band-sampler-timed-corrections-20261013, codex/beta-final-completion-20261014]
    paths:
      - models/infinite_symphony_showcase.py
      - models/final_band*.py
      - tools/build_infinite_symphony_showcase.py
      - .github/workflows/infinite-symphony-layout.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install layout dependencies
        run: python -m pip install numpy Pillow trimesh
      - name: Build nine-world native 3D layout
        run: python -m tools.build_infinite_symphony_showcase
      - name: Verify export and report full-song dependency
        run: |
          test -s outputs/Helix_Infinite_Symphony/xlights_rgbeffects.xml
          test -s outputs/Helix_Infinite_Symphony/infinite_symphony_manifest.json
          if [ -s LightsOutTheme.mp3 ]; then
            echo "Full LightsOutTheme source present"
          else
            echo "::warning::LightsOutTheme.mp3 is not tracked; full-song sequencing and video require the original audio."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Helix-Infinite-Symphony-3D-Layout
          path: outputs/Helix_Infinite_Symphony/
          if-no-files-found: error
          retention-days: 14
