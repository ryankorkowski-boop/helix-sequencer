name: Helix Unified Beta Integration

on:
  push:
    branches:
      - 'integration/unified-beta-completion-20261117'
    paths:
      - 'helix_intent/**'
      - 'core/**'
      - 'xlights/**'
      - 'animation/**'
      - 'models/**'
      - 'effects/**'
      - 'fixtures/band_geometry/**'
      - 'tools/build_drummer_v3*.py'
      - 'tools/run_helixville4_full_band_lightsouttheme_30s.py'
      - 'mapping/**'
      - 'audio/**'
      - 'tools/render_drummer_v3_preview.py'
      - 'tools/integrate_drummer_v3_into_xsq.py'
      - 'tools/validate_xsq_structure.py'
      - 'tests/**'
      - 'tools/layout_bench/**'
      - 'fixtures/layout_bench/**'
      - '.github/workflows/helix-unified-beta-integration.yml'
      - 'requirements*.txt'
      - 'tools/**'
      - 'gui_launcher.py'
      - 'android/**'
      - 'config/gui_options.json'
      - 'packaging/**'
  pull_request:
    paths:
      - 'helix_intent/**'
      - 'core/**'
      - 'xlights/**'
      - 'animation/**'
      - 'models/**'
      - 'effects/**'
      - 'fixtures/band_geometry/**'
      - 'tools/build_drummer_v3*.py'
      - 'mapping/**'
      - 'audio/**'
      - 'tools/render_drummer_v3_preview.py'
      - 'tools/integrate_drummer_v3_into_xsq.py'
      - 'tools/validate_xsq_structure.py'
      - 'tests/**'
      - 'tools/layout_bench/**'
      - 'fixtures/layout_bench/**'
      - '.github/workflows/helix-unified-beta-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helix-unified-beta-${{ github.ref }}
  # Preserve a complete acceptance result even during rapid integration pushes.
  # Newer runs queue instead of erasing the only full-suite evidence.
  cancel-in-progress: false

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile focused sources
        run: python -m compileall -q core/sequence_builder.py core/engine_activation_audit.py core/run_config_v2.py core/effects_orchestrator_bridge.py core/effect_engine.py core/birdsong_engine.py helix_intent/xlights_contract_validator.py helix_intent/xsq_template_writer.py tools/layout_bench/render_comparisons.py tests/test_layout_bench_xsq_selection.py
      - name: Verify orchestration argument propagation and reports
        run: |
          python -m pytest -q \
            tests/test_run_config_v2_orchestration.py \
            tests/test_sequence_builder_orchestrator_promotion.py \
            tests/test_engine_activation_audit.py \
            tests/test_sequence_builder.py \
            tests/test_effects_orchestrator_bridge.py \
            tests/test_orchestration_xsq_reconciliation.py \
            tests/test_birdsong_engine.py \
            tests/test_android_orchestrator_policy.py \
            tests/test_android_preview_states.py \
            tests/test_xlights_contract_validator.py \
            tests/test_xlights_effect_contract.py \
            tests/test_xsq_template_writer.py \
            tests/test_orchestration_motion_routing.py \
            tests/test_orchestration_explicit_layout.py \
            tests/test_bounded_audio.py \
            tests/test_preview_intensity_windows.py
      - name: Verify performance and recoverable native export regressions
        run: |
          python -m pytest -q \
            tests/test_active_multiband_mfcc_reuse.py \
            tests/test_artifact_discovery_filter.py \
            tests/test_native_effect_table_iteration.py \
            tests/test_shared_spectral_features.py \
            tests/test_xsq_parse_recoverable.py \
            tests/test_vivid_style.py \
            tests/test_source_spatial_direction.py \
            tests/test_infinity_showcase_layout.py \
            tests/test_native_choreography.py
      - name: Verify independently sourced singer activity and duplicate rejection
        run: python -m pytest -q tests/test_independent_vocals.py
      - name: Verify native XSQ and independent vocal tracks
        run: python -m pytest -q tests/test_validate_xsq_native_timing.py tests/test_beta14_native_timing_contract.py
      - name: Verify drummer alternation and localized illumination
        run: |
          python -m pip install pillow numpy imageio imageio-ffmpeg soundfile
          python -m pytest -q tests/test_drummer_hand_alternation.py tests/test_drummer_preview_aliases.py tests/test_drummer_independent_lighting.py
      - name: Generate original drummer assets and verify physical geometry
        run: |
          python tools/build_drummer_v3_assets.py
          python -m pytest -q tests/test_drummer_v3_pose_sheet.py tests/test_drummer_v3_png_layers.py tests/test_drummer_v3_xsq_integration.py tests/test_helixville4_audio_excerpt.py
      - name: Generate clean-room xLights fixtures and check nine-panel gate
        run: |
          python tools/layout_bench/generate_layouts.py
          python -m pytest -q tests/test_layout_bench.py tests/test_layout_bench_xsq_selection.py tests/test_layout_bench_native_fseq_publish.py tests/test_nine_panel_gate.py tests/test_showcase_preset_catalog.py

  full-suite:
    # The focused job above hid full-suite failures. This runs everything with
    # the pinned requirements on both supported interpreters.
    name: full suite / python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned requirements and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run the complete test suite
        run: python -m pytest -q -p no:cacheprovider
