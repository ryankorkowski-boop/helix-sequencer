name: Helix Infinity layout
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/build_infinity_showcase_layout.py
      - tools/patch_xlights_infinity_groups.py
      - .github/workflows/helix-infinity-layout.yml
  push:
    branches:
      - integration/unified-beta-completion-20261117
    paths:
      - tools/build_infinity_showcase_layout.py
      - tools/infinity_showcase_clip.py
      - tests/test_infinity_showcase_layout.py
      - tests/test_infinity_showcase_targeting.py
      - .github/workflows/helix-infinity-layout.yml
permissions:
  contents: read
jobs:
  layout:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Layout and targeting tests
        run: python -m pytest -q tests/test_infinity_showcase_layout.py tests/test_infinity_showcase_targeting.py
      - name: Verify full-song native FSEQ on the bounded Infinity tier
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
          NUMBA_NUM_THREADS: "1"
          XL_NO_GPU_COMPUTE: "1"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth ffmpeg libgtk-3-0t64 libgl1 libegl1 libegl-mesa0 libglu1-mesa libopengl0 libgstreamer-plugins-base1.0-0
          work="$RUNNER_TEMP/infinity"
          mkdir -p "$work/media"
          curl -fLsS --retry 2 'https://drive.usercontent.google.com/download?id=1Zjyz9b-V0SdJ-p9K2FN6ryUR2H88DELG&export=download&confirm=t' -o "$work/media/Bells of Mathmas.mp3"
          echo "beb2a064595a64d4924847ccd68ca0f2897d5de3ae5064e6e2023a68b7b8ce8a  $work/media/Bells of Mathmas.mp3" | sha256sum -c -
          curl -fLsS --retry 2 https://github.com/xLightsSequencer/xLights/releases/download/2026.18/xLights-2026.18-x86_64.AppImage -o "$work/xLights.AppImage"
          echo "62affb88b9a9b03cf5164974ac69bcefe35c559719d157b3364e4d4a5ab4214b  $work/xLights.AppImage" | sha256sum -c -
          (cd "$work" && chmod +x xLights.AppImage && ./xLights.AppImage --appimage-extract >/dev/null)
          export XLIGHTS_BIN="$work/squashfs-root/AppRun"
          python tools/build_infinity_showcase_layout.py --size 128 --output "$work/xlights_rgbeffects.xml" --manifest "$work/layout.json"
          python main.py --profile master -- --template template.xsq --audio "$work/media/Bells of Mathmas.mp3" --layout-file "$work/xlights_rgbeffects.xml" --output-dir "$work/sequence" --variants 1 --single --no-prompt --no-save-settings --no-learning-memory --no-workspace-history --birdsong --palette-mode workspace_match
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from tools.layout_bench.run_bench import canonical_xsq
          from tools.layout_bench.xlights_fseq import load_fseq, model_channel_report, render_sequence_to_fseq
          from core.output_provenance import sha256
          root = Path(os.environ["RUNNER_TEMP"]) / "infinity"
          audio = root / "media/Bells of Mathmas.mp3"
          layout = root / "xlights_rgbeffects.xml"
          xsq = canonical_xsq(root / "sequence", audio.stem)
          if xsq is None:
              raise SystemExit("Missing master-profile XSQ")
          shutil.copyfile(xsq, root / "Bells.xsq")
          fseq = root / "Bells.fseq"
          version = render_sequence_to_fseq(layout_xml=layout, xsq_path=xsq, media_path=audio,
                                            fseq_path=fseq, show_dir=root / "native")
          data = load_fseq(fseq)
          models = model_channel_report(layout, data)
          families = json.loads((root / "layout.json").read_text())["channel_map"]
          family_by_name = {r["name"]: r["family"] for r in families}
          active = sorted({family_by_name[r["name"]] for r in models if r["status"] == "rendered"})
          seconds = data.frames * data.step_ms / 1000
          report = dict(commit=os.environ["GITHUB_SHA"], native_version=version, duration=seconds,
                        hashes={p.name: sha256(p) for p in (audio, layout, xsq, fseq)},
                        active_families=active, models=models, owner_approved=False)
          (root / "verification.json").write_text(json.dumps(report, indent=2))
          if abs(seconds - 155.96) > .10 or len(active) != len(set(family_by_name.values())):
              raise SystemExit("Native duration or model-family coverage failed; see verification.json")
          PY
      - name: Render synchronized native-channel review MP4
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/infinity"
          python -m pip install imageio imageio-ffmpeg Pillow
          python -m tools.fseq_pixel_preview "$work/Bells.fseq" --layout "$work/xlights_rgbeffects.xml" --audio "$work/media/Bells of Mathmas.mp3" --width 1920 --height 1080 --output "$work/Bells-preview.mp4"
          ffmpeg -v error -xerror -i "$work/Bells-preview.mp4" -vf fps=30 -c:v libx264 -preset fast -crf 19 -pix_fmt yuv420p -c:a copy -movflags +faststart "$work/Bells-review.mp4"
          ffmpeg -v error -xerror -i "$work/Bells-review.mp4" -f null -
          ffprobe -v error -show_streams -show_format -of json "$work/Bells-review.mp4" > "$work/video-probe.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from core.output_provenance import sha256
          root = Path(os.environ["RUNNER_TEMP"]) / "infinity"
          probe = json.loads((root / "video-probe.json").read_text())
          report = json.loads((root / "Bells-preview.pixel_preview.json").read_text())
          video = next(s for s in probe["streams"] if s["codec_type"] == "video")
          audio = next(s for s in probe["streams"] if s["codec_type"] == "audio")
          assert (video["width"], video["height"], video["codec_name"], video["avg_frame_rate"]) == (1920, 1080, "h264", "30/1")
          assert audio["codec_name"] == "aac"
          assert abs(float(video["duration"]) - 155.96) < .15
          assert abs(float(audio["duration"]) - float(video["duration"])) < .15
          assert report["bright_node_samples"] > 0
          report.update(review_sha256=sha256(root / "Bells-review.mp4"), owner_approved=False,
                        classification="native FSEQ channel preview; approximate geometry; visual review required")
          (root / "video-review.json").write_text(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-Bells-bounded-native-engineering
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/infinity/xlights_rgbeffects.xml
            ${{ runner.temp }}/infinity/Bells.xsq
            ${{ runner.temp }}/infinity/Bells.fseq
            ${{ runner.temp }}/infinity/layout.json
            ${{ runner.temp }}/infinity/verification.json
            ${{ runner.temp }}/infinity/native/xlights.log
            ${{ runner.temp }}/infinity/Bells-review.mp4
            ${{ runner.temp }}/infinity/video-probe.json
            ${{ runner.temp }}/infinity/video-review.json

  full-native:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      HELIX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      HELIX_NATIVE_PREVIEW_WIDTH: '1920'
      HELIX_NATIVE_PREVIEW_HEIGHT: '1080'
      HELIX_DEMUCS_DEVICE: cpu
      XL_NO_GPU_COMPUTE: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned render prerequisites and retain the verified original excerpt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HELIX_SOURCE_COMMIT"
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb xauth openbox x11-utils x11-xserver-utils wmctrl xdotool \
            build-essential cmake ninja-build pkg-config libgtk-3-dev libopengl0 libegl-dev libglu1-mesa \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev freeglut3-dev libavcodec-dev \
            libavformat-dev libavfilter-dev libswscale-dev libsdl2-dev libzstd-dev libcurl4-openssl-dev \
            liblua5.3-dev libwebp-dev libsecret-1-dev libfreetype-dev libharfbuzz-dev libfontconfig-dev \
            libavahi-compat-libdnssd-dev libminizip-dev libxlsxwriter-dev cbp2make glslc glslang-dev
          python -m pip install scipy Pillow numpy zstandard requests pytest cmudict PyYAML
          mkdir -p infinity-work/media
          original="$RUNNER_TEMP/Bells of Mathmas.mp3"
          curl -fLsS --retry 3 'https://drive.usercontent.google.com/download?id=1Zjyz9b-V0SdJ-p9K2FN6ryUR2H88DELG&export=download&confirm=t' -o "$original"
          original_sha=beb2a064595a64d4924847ccd68ca0f2897d5de3ae5064e6e2023a68b7b8ce8a
          echo "$original_sha  $original" | sha256sum -c -
          echo "HELIX_INFINITY_ORIGINAL_SHA=$original_sha" >> "$GITHUB_ENV"
          excerpt=infinity-work/media/Bells_of_Mathmas_30s.wav
          ffmpeg -nostdin -v error -i "$original" -t 30 -c:a pcm_s16le "$excerpt"
          echo "HELIX_INFINITY_EXCERPT_SHA=$(sha256sum "$excerpt" | cut -d ' ' -f1)" >> "$GITHUB_ENV"
      - name: Separate the real original excerpt on CPU
        uses: ./.github/actions/production-audio
        with:
          audio: infinity-work/media/Bells_of_Mathmas_30s.wav
          sha256: ${{ env.HELIX_INFINITY_EXCERPT_SHA }}
      - name: Generate the full musical XSQ on all 10,240 props
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_infinity_showcase_layout.py tests/test_infinity_showcase_targeting.py
          python -m tools.build_infinity_showcase_layout --size 10240 --output infinity-work/xlights_rgbeffects.xml --manifest infinity-work/layout.json
          python main.py --profile master -- --template template.xsq --audio infinity-work/media/Bells_of_Mathmas_30s.wav \
            --layout-file infinity-work/xlights_rgbeffects.xml --output-dir infinity-work/sequence --variants 1 \
            --single --no-prompt --no-save-settings --no-learning-memory --no-workspace-history \
            --birdsong --palette-mode workspace_match > infinity-work/sequencer.log 2>&1
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path('infinity-work')
          layout = json.loads((root / 'layout.json').read_text())
          assert (layout['model_count'], layout['group_count'], layout['rgb_channel_count']) == (10240, 10299, 2370240)
          source, = (p for p in (root / 'sequence').glob('*.xsq') if '.uncolored.' not in p.name and '.orchestrated.' not in p.name)
          seq = ET.parse(source)
          seq.find('head/mediaFile').text = 'media/Bells_of_Mathmas_30s.wav'
          seq.write(root / 'Bells_of_Mathmas_30s.xsq', encoding='utf-8', xml_declaration=True)
          networks = ET.Element('Networks', DisableOutput='1')
          ET.SubElement(networks, 'network', NetworkType='NULL', Description='Null', MaxChannels='2370240', BaudRate='115200', ComPort='1')
          ET.ElementTree(networks).write(root / 'xlights_networks.xml', encoding='utf-8', xml_declaration=True)
          receipt = {'source_commit': os.environ['HELIX_SOURCE_COMMIT'], 'owner_approved': False,
                     'original_audio_sha256': os.environ['HELIX_INFINITY_ORIGINAL_SHA'],
                     'audio_sha256': os.environ['HELIX_INFINITY_EXCERPT_SHA'], 'layout_sha256': layout['sha256']}
          (root / 'run_manifest.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Restore the compiled base renderer
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xlights-src
          key: xlights-native-ubuntu24-2026.18-${{ hashFiles('tools/patch_xlights_native_export.py') }}
          restore-keys: xlights-native-ubuntu24-2026.18-
      - name: Apply batched group loading and compile the exact native renderer
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/xlights-src"
          if [ ! -d "$native/.git" ]; then
            git clone --depth 1 --branch 2026.18 --recurse-submodules https://github.com/xLightsSequencer/xLights.git "$native"
          fi
          test "$(git -C "$native" rev-parse HEAD)" = 839c0f590dc454bb7adb8a16c4dd92a70b46156e
          if [ -f "$native/wxWidgets-xlights_2026.17c/lib/libwx_gtk3u-3.3.so.4.0.0" ]; then
            sudo make -C "$native/wxWidgets-xlights_2026.17c" install
            sudo ldconfig
          fi
          if ! python -c 'import sys; from pathlib import Path; from tools.native_renderer_bundle import validate_tree; validate_tree(Path(sys.argv[1]))' "$native"; then
            mapfile -t files < <(python -c 'from tools.patch_xlights_native_export import PATCHES; print("\n".join(PATCHES))')
            git -C "$native" restore -- "${files[@]}"
            python -m tools.patch_xlights_native_export "$native"
          fi
          python -m tools.patch_xlights_infinity_groups "$native"
          git -C "$native" diff --check
          timeout --signal=TERM --kill-after=30s 55m make -C "$native" -j 4 2>&1 | tee infinity-work/native-build.log
          test -x "$native/bin/xLights"
          ldd "$native/bin/xLights" | tee infinity-work/native-runtime-libraries.log
          ! grep -q 'not found' infinity-work/native-runtime-libraries.log
          echo "HELIX_PATCHED_XLIGHTS=$native/bin/xLights" >> "$GITHUB_ENV"
      - name: Render native FSEQ and original-soundtrack 1080p movie
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 2560x1440x24' sh -c 'openbox >infinity-work/openbox.log 2>&1 & exec python -m tools.native_preview infinity-work --xsq infinity-work/Bells_of_Mathmas_30s.xsq --audio infinity-work/media/Bells_of_Mathmas_30s.wav --xlights "$HELIX_PATCHED_XLIGHTS" --render-timeout 1800 --review-30fps'
      - name: Decode and verify full native channel and audio delivery
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.verify_recovery_media import verify
          from tools.verify_showcase_luma import verify_mp4
          root = Path('infinity-work')
          native = json.loads((root / 'run_manifest.json').read_text())['native_preview']
          channels = json.loads((Path(native['evidence_dir']) / 'native_channels.json').read_text())
          assert channels['channels'] == 2370240 and channels['frames'] == 600 and channels['nonzero_samples'] > 0
          movie = Path(native['mp4'])
          media = verify(movie, root / 'media/Bells_of_Mathmas_30s.wav', os.environ['HELIX_INFINITY_EXCERPT_SHA'])
          assert media['dimensions'] == [1920, 1080] and media['actual_frame_rate'] == '30/1'
          readback = verify_mp4(movie)
          (root / 'INFINITY_REVIEW_PROOF.json').write_text(json.dumps({
              'media': media, 'channels': channels, 'readability': readback, 'owner_approved': False,
          }, indent=2) + '\n')
          if not readback['passed']:
              raise SystemExit('Native Infinity movie failed decoded visibility or motion')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-10240-Bells-native-review
          if-no-files-found: warn
          path: |
            infinity-work/xlights_rgbeffects.xml
            infinity-work/xlights_networks.xml
            infinity-work/Bells_of_Mathmas_30s.xsq
            infinity-work/media/Bells_of_Mathmas_30s.wav
            infinity-work/layout.json
            infinity-work/run_manifest.json
            infinity-work/INFINITY_REVIEW_PROOF.json
            infinity-work/*.log
            infinity-work/native-preview-*/*.fseq
            infinity-work/native-preview-*/preview.mp4
            infinity-work/native-preview-*/native_*.json
            infinity-work/native-preview-*/native_*.log
