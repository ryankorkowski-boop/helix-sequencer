name: Recover full effect engine

on:
  push:
    branches:
      - repair/effect-engine-recovery-2026-08-13

permissions:
  contents: write

jobs:
  recover-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified full effect engine
        id: restore
        run: |
          TARGET_SHA=191bf5ad0586ed1da9ae78fd66e22ded49183520
          git fetch origin "$TARGET_SHA"
          git restore --source "$TARGET_SHA" -- core/effect_engine.py
          if git diff --quiet -- core/effect_engine.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit restored engine
        if: steps.restore.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/effect_engine.py
          git commit -m "Recover full effect engine from verified ancestor"
          git push origin HEAD:repair/effect-engine-recovery-2026-08-13

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Verify engine and sequence builder
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import inspect
          from core import effect_engine
          from core import sequence_builder
          assert hasattr(effect_engine, "main_for"), "Recovered effect_engine.main_for is missing"
          assert len(inspect.getsource(effect_engine).splitlines()) > 500, "effect_engine still looks truncated"
          assert len(inspect.getsource(sequence_builder).splitlines()) > 400, "sequence_builder looks truncated"
          print("effect_engine lines:", len(inspect.getsource(effect_engine).splitlines()))
          print("sequence_builder lines:", len(inspect.getsource(sequence_builder).splitlines()))
          print("main_for:", effect_engine.main_for)
          PY
          pytest -q tests/test_sequence_builder.py tests/test_effects.py tests/test_effect_intelligence_system.py

      - name: Verify bridge imports
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from core import effects_orchestration_bridge as bridge
          from core import effects_orchestrator_bridge as canonical
          assert bridge.run_effects_orchestration is canonical.run_effects_orchestration
          print("orchestration bridge OK")
          PY

      - name: Remove recovery workflow after successful validation
        if: success() && steps.restore.outputs.changed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/recover-effect-engine.yml
          git commit -m "Remove temporary effect engine recovery workflow"
          git push origin HEAD:repair/effect-engine-recovery-2026-08-13
