name: Helix Ultimate Showcase Preview

on:
  push:
    branches: [feature/ultimate-helix-showcase]
    paths:
      - 'models/ultimate_showcase.py'
      - 'tools/build_ultimate_showcase_layout.py'
      - 'tools/build_helpers/ultimate_showcase*.py'
      - 'tools/audit_ultimate_showcase_native.py'
      - 'tests/test_ultimate_showcase.py'
      - '.github/workflows/helix-ultimate-showcase-preview.yml'
  workflow_dispatch:
    inputs:
      collection:
        description: 'Build the six additional artistic showcase layouts'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ultimate-showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SHOW_DIR: outputs/ultimate_showcase/Helix_Aurora
      XL_NO_GPU_COMPUTE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install layout and native-render dependencies
        run: |
          python -m pip install numpy pillow pytest zstandard
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth ffmpeg libgtk-3-0t64 libgl1 libegl1 libegl-mesa0 libopengl0 libglu1-mesa libgstreamer-plugins-base1.0-0
      - name: Validate new and existing layouts
        run: |
          python -m pytest -q \
            tests/test_showcase_flavors.py \
            tests/test_ultimate_showcase.py \
            tests/test_helixia_layout.py tests/test_helixia_3d_layout.py \
            tests/test_preview_helixia_3d_layout.py \
            tests/test_build_helixia_layout_cli.py tests/test_build_demo_helixia_bundle.py \
            tests/test_helixia_double_helix.py tests/test_helixia_double_helix_integration.py \
            tests/test_helixia_double_helix_xlights_plan.py \
            tests/test_preview_helixia_double_helix.py tests/test_working_double_helix.py
      - name: Build the standalone native show
        if: ${{ inputs.collection != true }}
        run: python -m tools.build_ultimate_showcase_layout --output "$SHOW_DIR" --no-video --no-zip
      - name: Install pinned xLights 2026.18
        run: |
          mkdir -p "$RUNNER_TEMP/xlights-native"
          cd "$RUNNER_TEMP/xlights-native"
          curl --fail --location --retry 3 --output xlights.AppImage https://github.com/xLightsSequencer/xLights/releases/download/2026.18/xLights-2026.18-x86_64.AppImage
          echo '62affb88b9a9b03cf5164974ac69bcefe35c559719d157b3364e4d4a5ab4214b  xlights.AppImage' | sha256sum --check
          chmod +x xlights.AppImage
          ./xlights.AppImage --appimage-extract > /dev/null
      - name: Render actual native channel values
        if: ${{ inputs.collection != true }}
        run: |
          xvfb-run -a "$RUNNER_TEMP/xlights-native/squashfs-root/AppRun" \
            --headless -q -s "$GITHUB_WORKSPACE/$SHOW_DIR" \
            -od "$GITHUB_WORKSPACE/$SHOW_DIR" \
            "$GITHUB_WORKSPACE/$SHOW_DIR/Helix_Aurora_Showcase.xsq"
          test -s "$SHOW_DIR/Helix_Aurora_Showcase.fseq"
      - name: Create MP4 using native lighting and verify all RGB pixels
        if: ${{ inputs.collection != true }}
        run: |
          python -m tools.build_ultimate_showcase_layout --output "$SHOW_DIR" \
            --native-fseq "$SHOW_DIR/Helix_Aurora_Showcase.fseq" --no-zip
          python -m tools.audit_ultimate_showcase_native "$SHOW_DIR"
          mkdir -p "$SHOW_DIR/review_frames"
          for second in 1 5 12 20; do
            ffmpeg -v error -y -ss "$second" -i "$SHOW_DIR/Helix_Aurora_Showcase.mp4" \
              -frames:v 1 "$SHOW_DIR/review_frames/frame_${second}s.png"
          done
          python -m tools.build_ultimate_showcase_layout --output "$SHOW_DIR" --package-only
      - name: Upload the importable show, viewer, MP4 and native proof
        if: ${{ inputs.collection != true }}
        uses: actions/upload-artifact@v4
        with:
          name: helix-aurora-ultimate-showcase
          path: outputs/ultimate_showcase/Helix_Aurora_Ultimate_Showcase.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build and verify all six native shows and lighting videos
        if: ${{ inputs.collection == true }}
        run: |
          xvfb-run -a python -m tools.build_showcase_flavors \
            --xlights "$RUNNER_TEMP/xlights-native/squashfs-root/AppRun"
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.build_ultimate_showcase_layout import package_showcase
          import subprocess
          root=Path('outputs/showcase_flavors')
          collection=json.loads((root/'collection_manifest.json').read_text())
          for show in collection['layouts']:
              folder=root/show['slug'];frames=folder/'review_frames';frames.mkdir(exist_ok=True)
              for second in (1,5,12,20):
                  subprocess.run(['ffmpeg','-v','error','-y','-ss',str(second),'-i',str(folder/(show['slug']+'_Showcase.mp4')),'-frames:v','1',str(frames/f'frame_{second}s.png')],check=True)
              package_showcase(folder)
          PY
          python -m tools.build_showcase_flavors --gallery-only
      - name: Upload compact all-layouts gallery and native shows
        if: ${{ inputs.collection == true }}
        uses: actions/upload-artifact@v4
        with:
          name: helix-six-flavors-layouts
          path: outputs/showcase_flavors/Helix_Six_Flavors_Layouts.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload the collection tour and comparison
        if: ${{ inputs.collection == true }}
        uses: actions/upload-artifact@v4
        with:
          name: helix-six-flavors-review
          path: |
            outputs/showcase_flavors/Helix_Six_Flavors_Tour.mp4
            outputs/showcase_flavors/Helix_Six_Flavors_Comparison.png
            outputs/showcase_flavors/collection_manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Neon Circuit
        if: ${{ inputs.collection == true }}
        uses: actions/upload-artifact@v4
        with:
          name: helix-neon-circuit
          path: outputs/showcase_flavors/Helix_Neon_Circuit_Ultimate_Showcase.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Enchanted Grove
        if: ${{ inputs.collection == true }}
        uses: actions/upload-artifact@v4
        with:
          name: helix-enchanted-grove
          path: outputs/showcase_flavors/Helix_Enchanted_Grove_Ultimate_Showcase.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Celestial Orrery
        if: ${{ inputs.collection == true }}
        uses: actions/upload-artifact@v4
        with:
          name: helix-celestial-orrery
          path: outputs/showcase_flavors/Helix_Celestial_Orrery_Ultimate_Showcase.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Fire and Ice
        if: ${{ inputs.collection == true }}
        uses: actions/upload-artifact@v4
        with:
          name: helix-fire-and-ice
          path: outputs/showcase_flavors/Helix_Fire_and_Ice_Ultimate_Showcase.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Crystal Lagoon
        if: ${{ inputs.collection == true }}
        uses: actions/upload-artifact@v4
        with:
          name: helix-crystal-lagoon
          path: outputs/showcase_flavors/Helix_Crystal_Lagoon_Ultimate_Showcase.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Midnight Masquerade
        if: ${{ inputs.collection == true }}
        uses: actions/upload-artifact@v4
        with:
          name: helix-midnight-masquerade
          path: outputs/showcase_flavors/Helix_Midnight_Masquerade_Ultimate_Showcase.zip
          if-no-files-found: error
          retention-days: 30
