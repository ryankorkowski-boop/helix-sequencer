name: Helixville4 Six Piece Band Render

on:
  workflow_dispatch:
  push:
    branches:
      - feature/restructure-core
    paths:
      - 'tools/build_helpers/helixville4_full_band.py'
      - 'tools/build_helixville4_full_band_layout.py'
      - 'tools/build_helpers/helixville4_floor_piano.py'
      - 'tools/run_helixville4_full_band_lightsouttheme_30s.py'
      - 'core/sequence_builder.py'
      - 'core/effect_engine.py'
      - 'core/run_config.py'
      - 'core/run_spine.py'
      - 'core/run_manager.py'
      - 'core/effects_orchestration_bridge.py'
      - 'tools/preview_renderer.py'
      - '.github/workflows/helixville4-six-piece-band-render.yml'

jobs:
  six-piece-render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/restructure-core

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install render dependencies
        run: python -m pip install numpy scipy librosa soundfile numba llvmlite imageio imageio-ffmpeg pillow scikit-learn

      - name: Verify audio
        run: |
          test -f "$GITHUB_WORKSPACE/Helix Audiolights.mp3"
          python - <<'PY'
          import imageio_ffmpeg, subprocess
          from pathlib import Path
          audio = Path("Helix Audiolights.mp3")
          p = subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), '-i', str(audio), '-f', 'null', '-'], capture_output=True)
          assert p.returncode == 0, p.stderr.decode(errors='ignore')
          print(f"AUDIO_OK: {audio.resolve()}")
          PY

      - name: Build full band plus keyboard layout
        env:
          PYTHONPATH: .
        run: |
          OUT="$GITHUB_WORKSPACE/test_runs/helixville4_six_piece_band"
          mkdir -p "$OUT"
          python tools/build_helixville4_full_band_layout.py --output-dir "$OUT"
          python - <<'PY'
          from pathlib import Path
          from tools.build_helpers.helixville4_floor_piano import add_floor_piano_to_layout
          out = Path("test_runs/helixville4_six_piece_band").resolve()
          add_floor_piano_to_layout(out / "xlights_rgbeffects.xml")
          print("SIX_PIECE_BAND: singer + backup singer + bass + guitar + keyboard + drummer")
          print(f"LAYOUT: {out / 'xlights_rgbeffects.xml'}")
          PY

      - name: Generate six-piece sequence
        env:
          PYTHONPATH: .
        run: |
          OUT="$GITHUB_WORKSPACE/test_runs/helixville4_six_piece_band"
          python -m core.sequence_builder \
            --profile v27.3 -- \
            --template "$GITHUB_WORKSPACE/template.xsq" \
            --audio "$GITHUB_WORKSPACE/Helix Audiolights.mp3" \
            --layout-file "$OUT/xlights_rgbeffects.xml" \
            --single \
            --output-dir "$OUT" \
            --variants 1 \
            --no-prompt \
            --no-save-settings \
            --no-workspace-history \
            --no-polish \
            --no-matrix-intelligence \
            --audio-reactive-profile showcase \
            --spatial-awareness 0.8 \
            --chase-style top_to_bottom \
            --polyphony 6 \
            --keyboard-mix 1.0 \
            --max-layers-per-prop 3

      - name: Locate and validate generated sequence
        run: |
          OUT="$GITHUB_WORKSPACE/test_runs/helixville4_six_piece_band"
          echo "=== XSQ candidates in requested output ==="
          find "$OUT" -type f -name '*.xsq' -print | sort
          echo "=== XSQ candidates anywhere in workspace ==="
          find "$GITHUB_WORKSPACE" -type f -name '*.xsq' -print | sort | head -200
          XSQ=$(find "$OUT" -type f -name '*.xsq' -print -quit)
          if [ -z "$XSQ" ]; then
            echo "ERROR: sequence_builder completed successfully but produced no XSQ under $OUT"
            echo "=== output tree ==="
            find "$OUT" -maxdepth 5 -type f -print | sort
            exit 1
          fi
          test -s "$XSQ"
          echo "GENERATED_XSQ=$XSQ" >> "$GITHUB_ENV"
          echo "GENERATED_XSQ=$XSQ"

      - name: Render MP4
        env:
          PYTHONPATH: .
        run: |
          OUT="$GITHUB_WORKSPACE/test_runs/helixville4_six_piece_band"
          python -m tools.preview_renderer "$GENERATED_XSQ" \
            --layout "$OUT/xlights_rgbeffects.xml" \
            --audio "$GITHUB_WORKSPACE/Helix Audiolights.mp3" \
            --fps 10 \
            --width 960 \
            --height 540
          MP4="${GENERATED_XSQ%.xsq}.mp4"
          test -s "$MP4"
          echo "GENERATED_MP4=$MP4" >> "$GITHUB_ENV"
          echo "GENERATED_MP4=$MP4"

      - name: Write six-piece manifest
        run: |
          cat > "$GITHUB_WORKSPACE/test_runs/helixville4_six_piece_band/SIX_PIECE_BAND_MANIFEST.txt" <<EOF
          HELIXVILLE4 SIX-PIECE BAND TEST
          1. Singer: HX_SNOWMAN_SINGER
          2. Backup singer: HX_SNOWMAN_SINGER_FEMALE
          3. Bass: HX_SNOWMAN_BASSIST
          4. Guitar: HX_SNOWMAN_GUITARIST
          5. Keyboard: HX_FLOOR_PIANO
          6. Drummer: HX_SNOWMAN_DRUMMER
          Audio: Helix Audiolights.mp3
          XSQ: $GENERATED_XSQ
          MP4: $GENERATED_MP4
          Render: 960x540 @ 10 fps
          EOF

      - name: Upload six-piece MP4 and sequence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helixville4-six-piece-band-render
          path: |
            test_runs/helixville4_six_piece_band/**/*
          if-no-files-found: error
