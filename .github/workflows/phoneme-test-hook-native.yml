name: Phoneme Test Hook native MP4 verification
on:
  push:
    branches: [codex/eight-hour-recovery-20261019]
    paths: [.github/workflows/phoneme-test-hook-native.yml, 'fixtures/audio/**', tools/phoneme_source.py, tools/prepare_phoneme_show.py, tools/finalize_phoneme_review.py, tools/native_preview.py, 'core/**', 'xlights/**', 'models/**']
  workflow_dispatch:
    inputs:
      audio_url:
        description: Optional HTTPS override; default is the retained hash-verified owner recording
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: phoneme-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HELIX_PHONEME_AUDIO_URL: ${{ inputs.audio_url }}
      HELIX_PHONEME_AUDIO_TOKEN: ${{ secrets.HELIX_PHONEME_AUDIO_TOKEN }}
      HELIX_NATIVE_PREVIEW_WIDTH: '1280'
      HELIX_NATIVE_PREVIEW_HEIGHT: '720'
      XL_NO_GPU_COMPUTE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve and verify original source before dependency installation
        run: python -m tools.phoneme_source phoneme-work/input
      - name: Install DSP and native GUI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb xauth openbox x11-utils x11-xserver-utils wmctrl xdotool libgtk-3-0t64 libgl1 libegl1 libopengl0 libglu1-mesa libgstreamer-plugins-base1.0-0
          python -m pip install numpy scipy librosa==0.10.2.post1 soundfile numba llvmlite Pillow trimesh moderngl zstandard imageio imageio-ffmpeg cmudict PyYAML requests pytest
      - name: Validate source ingestion, DSP equivalence and strict native faces
        run: python -m pytest tests/test_phoneme_source.py tests/test_audio_analysis_reuse.py tests/test_native_face_instructions.py -q
      - name: Prepare complete show from current Helix source
        run: python -m tools.prepare_phoneme_show --audio phoneme-work/input/Phoneme_Test_Hook.mp3 --output phoneme-work/show
      - name: Install checksum-pinned xLights renderer
        run: |
          mkdir -p "$RUNNER_TEMP/phoneme-xlights"
          cd "$RUNNER_TEMP/phoneme-xlights"
          curl -fLsS --retry 3 -o xLights.AppImage https://github.com/xLightsSequencer/xLights/releases/download/2026.18/xLights-2026.18-x86_64.AppImage
          echo '62affb88b9a9b03cf5164974ac69bcefe35c559719d157b3364e4d4a5ab4214b  xLights.AppImage' | sha256sum -c -
          chmod +x xLights.AppImage
          ./xLights.AppImage --appimage-extract >/dev/null
          ldd squashfs-root/usr/bin/xLights | tee "$GITHUB_WORKSPACE/phoneme-work/native-runtime.log"
          if grep -q 'not found' "$GITHUB_WORKSPACE/phoneme-work/native-runtime.log"; then exit 1; fi
          echo "PHONEME_XLIGHTS=$RUNNER_TEMP/phoneme-xlights/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Native xLights FSEQ and original-soundtrack MP4
        run: |
          xvfb-run -a -s '-screen 0 2560x1440x24' sh -c 'openbox >phoneme-work/openbox.log 2>&1 & exec python -m tools.native_preview phoneme-work/show --xsq phoneme-work/show/Phoneme_Test_Hook_Helix.xsq --audio phoneme-work/show/media/Phoneme_Test_Hook.mp3 --xlights "$PHONEME_XLIGHTS"'
      - name: Fully decode and collect actual native movie from render receipt
        if: always()
        run: |
          if [ -f phoneme-work/show/run_manifest.json ]; then
            python -m tools.finalize_phoneme_review phoneme-work/show
          else
            echo '::error::Show preparation failed; see source_ingestion.json and sequencer.log in diagnostics artifact'
            exit 1
          fi
      - name: Preserve editable sequence, native media and actionable diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoneme-test-hook-native-review-${{ github.sha }}
          path: phoneme-work/
          if-no-files-found: error
