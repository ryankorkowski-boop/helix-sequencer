name: Infinity V5 exact native sequence
on:
  push:
    branches: [design/infinity-3d-showcase-20261127]
    paths:
      - tools/export_infinity_v5.py
      - tools/infinity_canonical_band.py
      - tests/test_infinity_spatial_export.py
      - .github/workflows/infinity-v5-native.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infinity-native-three-second
  cancel-in-progress: true
jobs:
  render-verified-three-seconds:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HELIX_DEMUCS_DEVICE: cpu
      XL_NO_GPU_COMPUTE: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Helix DSP and native renderer requirements
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb xauth libgtk-3-0t64 libgl1 libegl1 libegl-mesa0 libglu1-mesa libopengl0 libgstreamer-plugins-base1.0-0
          python -m pip install -r requirements.txt trimesh zstandard gdown==6.4.2 cmudict pytest
      - name: Validate and export native Infinity layout
        env:
          INFINITY_V5_ASSET_URL: ${{ secrets.INFINITY_V5_ASSET_URL }}
        run: |
          set -euo pipefail
          mkdir -p infinity-review
          if [ -n "${INFINITY_V5_ASSET_URL:-}" ]; then
            curl -fLsS "$INFINITY_V5_ASSET_URL" -o infinity-review/v5.zip
          else
            python -m gdown 1xdq5R5vhCEmzES_YTxUMkv4r3bIiAHkA -O infinity-review/v5.zip
          fi
          unzip -q infinity-review/v5.zip -d infinity-review/v5
          CSV=$(find infinity-review/v5 -name '*Channel_Map.csv' -print -quit)
          test -n "$CSV"
          python -m tools.export_infinity_v5 "$CSV" infinity-review/layout
      - name: Fetch real Wub Wub Wonderland remastered from owner Drive
        run: |
          set -euo pipefail
          mkdir -p infinity-review/media
          python -m gdown '1iRxuTue92q-JDBnIo7ihwqycTyHw_Be4' -O infinity-review/media/Wub_Wub_Wonderland_Remastered.mp3
          test -s infinity-review/media/Wub_Wub_Wonderland_Remastered.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 infinity-review/media/Wub_Wub_Wonderland_Remastered.mp3
          sha256sum infinity-review/media/Wub_Wub_Wonderland_Remastered.mp3 | tee infinity-review/audio-source-sha256.txt
          ffmpeg -nostdin -v error -y -ss 25 -i infinity-review/media/Wub_Wub_Wonderland_Remastered.mp3 -t 3 -ar 44100 -ac 2 -c:a pcm_s16le infinity-review/media/Wub_Wub_3s.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 infinity-review/media/Wub_Wub_3s.wav
          sha256sum infinity-review/media/Wub_Wub_3s.wav | tee infinity-review/audio-excerpt-sha256.txt
      - name: Run real Helix master choreography and emit editable XSQ
        run: |
          set -euo pipefail
          python main.py --profile master -- --template template.xsq --audio infinity-review/media/Wub_Wub_3s.wav --layout-file infinity-review/layout/xlights_rgbeffects.xml --output-dir infinity-review/sequence --variants 1 --single --no-prompt --no-save-settings --no-learning-memory --no-workspace-history --birdsong --palette-mode workspace_match > infinity-review/helix.log 2>&1
          find infinity-review/sequence -name '*.xsq' -type f -print
      - name: Install pinned native xLights 2026.18
        run: |
          set -euo pipefail
          mkdir -p infinity-review/xlights-native
          cd infinity-review/xlights-native
          curl -fLsS --retry 3 https://github.com/xLightsSequencer/xLights/releases/download/2026.18/xLights-2026.18-x86_64.AppImage -o xLights.AppImage
          echo '62affb88b9a9b03cf5164974ac69bcefe35c559719d157b3364e4d4a5ab4214b  xLights.AppImage' | sha256sum -c -
          chmod +x xLights.AppImage
          ./xLights.AppImage --appimage-extract > /dev/null
      - name: Render actual xLights FSEQ and verify output channels
        run: |
          set -euo pipefail
          xvfb-run -a python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.layout_bench.run_bench import canonical_xsq
          from tools.layout_bench.xlights_fseq import load_fseq, model_channel_report, render_sequence_to_fseq
          from core.output_provenance import sha256
          p = Path('infinity-review')
          audio = p/'media/Wub_Wub_3s.wav'
          layout = p/'layout/xlights_rgbeffects.xml'
          xsq = canonical_xsq(p/'sequence', audio.stem)
          if xsq is None:
              raise RuntimeError('No real master-profile XSQ found for the real Wub Wub excerpt')
          os.environ['XLIGHTS_BIN'] = str((p/'xlights-native/squashfs-root/AppRun').resolve())
          fseq = p/'Wub_Wub_3s.fseq'
          version = render_sequence_to_fseq(layout_xml=layout, xsq_path=xsq, media_path=audio, fseq_path=fseq, show_dir=p/'native')
          data = load_fseq(fseq)
          seconds = data.frames*data.step_ms/1000
          report = model_channel_report(layout, data)
          active = [r['name'] for r in report if r['status']=='rendered']
          if not (2.7 <= seconds <= 3.3 and active):
              raise RuntimeError(f'Native FSEQ duration/activity failed: {seconds}s / {len(active)} active models')
          receipt = {'status':'NATIVE_ENGINEERING_REVIEW_PENDING','owner_approved':False,
                     'renderer':version,'duration_seconds':seconds,'native_active_model_count':len(active),
                     'original_audio_source':'Wub Wub Wonderland (Remastered).mp3 in owner Drive',
                     'original_drive_file_id':'1iRxuTue92q-JDBnIo7ihwqycTyHw_Be4',
                     'excerpt_start_seconds':25,'excerpt_duration_seconds':3,
                     'input_audio_sha256':sha256(audio),'layout_sha256':sha256(layout),
                     'xsq_sha256':sha256(xsq),'fseq_sha256':sha256(fseq),
                     'preview_geometry':'approximate xLights 2D projection, not validated 3D visual acceptance'}
          (p/'NATIVE_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          (p/'model_activity.json').write_text(json.dumps(report,indent=2)+'\n')
          (p/'Wub_Wub_3s.xsq').write_bytes(xsq.read_bytes())
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Infinity-V5-native-sequence
          path: |
            infinity-review/*.fseq
            infinity-review/*.xsq
            infinity-review/*.json
            infinity-review/*.log
            infinity-review/layout/
            infinity-review/media/Wub_Wub_3s.wav
