name: November 13 three-second actual legacy comparison
on:
  push:
    branches: [recovery/nov13-three-second-20261127]
    paths: [.github/workflows/nov13-three-second.yml]
  workflow_dispatch:
jobs:
  three-second:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install numpy scipy librosa soundfile Pillow imageio imageio-ffmpeg matplotlib scikit-learn pydub PyYAML gdown==6.4.2
      - name: Extract identical three-second Bells sample
        run: |
          mkdir -p recovery
          python -m gdown 1Zjyz9b-V0SdJ-p9K2FN6ryUR2H88DELG -O recovery/original.mp3
          ffmpeg -v error -y -ss 45 -i recovery/original.mp3 -t 3 -ac 2 -ar 44100 recovery/clip.wav
      - name: Run actual November 13 v28.9 sequencing and video
        run: |
          PYTHONPATH=. python -m tools.run_v28_legacy_256_previews --audio recovery/clip.wav --template template.xsq --layout xlights_rgbeffects.xml --versions v28.9 --duration-seconds 3 --fps 10 --width 960 --height 540 --output-root recovery/nov13
      - name: Repair audio mux using system FFmpeg if archived bundled mux failed
        if: always()
        run: |
          for silent in recovery/nov13/v28.9/*.silent.mp4; do
            [ -f "$silent" ] || continue
            out="${silent%.silent.mp4}.mp4"
            ffmpeg -v error -y -i "$silent" -i recovery/nov13/_media/clip.first_3s.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -shortest "$out"
          done
      - name: Verify decoded video and save report
        if: always()
        run: |
          python - <<'PY'
          import glob,json,subprocess
          videos=glob.glob('recovery/nov13/**/*.mp4',recursive=True)
          results=[]
          for p in videos:
              proc=subprocess.run(['ffmpeg','-v','error','-i',p,'-f','null','-'],capture_output=True,text=True)
              results.append({'file':p,'decode_ok':proc.returncode==0,'stderr':proc.stderr[-2000:]})
          open('recovery/decode_audit.json','w').write(json.dumps({'commit':'1b1ff83c9c1b992a3ad5e202fc29ee0b292919bf','videos':results},indent=2))
          print(json.dumps(results))
          PY
      - name: Measure actual frame-wide flicker instead of trusting render success
        if: always()
        run: |
          python - <<'PY'
          import glob,subprocess,json,numpy as np
          from PIL import Image
          from io import BytesIO
          paths=[p for p in glob.glob('recovery/nov13/v28.9/*.mp4') if not p.endswith('.silent.mp4')]
          if not paths: paths=glob.glob('recovery/nov13/v28.9/*.silent.mp4')
          reports=[]
          for path in paths:
              p=subprocess.run(['ffmpeg','-v','error','-i',path,'-vf','fps=10,scale=160:90','-f','image2pipe','-vcodec','mjpeg','-'],capture_output=True)
              chunks=p.stdout.split(b'\\xff\\xd8')
              frames=[]
              for chunk in chunks[1:]:
                  try: frames.append(np.asarray(Image.open(BytesIO(b'\\xff\\xd8'+chunk)).convert('RGB'),dtype=np.float32))
                  except Exception: pass
              if len(frames)<2: continue
              x=np.stack(frames)
              bright=x.max(axis=3)
              deltas=np.abs(np.diff(x,axis=0)).mean(axis=3)
              fraction=(deltas>35).mean(axis=(1,2))
              global_brightness=bright.mean(axis=(1,2))
              reports.append({'path':path,'frames':len(frames),'mean_brightness_per_frame':[round(float(z),2) for z in global_brightness],'fraction_pixels_changing_above_35_per_transition':[round(float(z),3) for z in fraction],'max_global_change_fraction':float(fraction.max()),'transitions_over_30_percent':int((fraction>0.30).sum()),'suspicious_repeated_whole_scene_flicker':bool((fraction>0.30).sum()>=2)})
          open('recovery/flicker_audit.json','w').write(json.dumps(reports,indent=2))
          print(json.dumps(reports,indent=2))
          if not reports: raise SystemExit('No decoded video for flicker audit')
          PY
      - name: Upload real November 13 preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: November13-Three-Second-Real-Preview
          path: |
            recovery/nov13/**/*.mp4
            recovery/nov13/**/*.json
            recovery/decode_audit.json
            recovery/flicker_audit.json
          if-no-files-found: warn
