name: Helix CI

on:
  pull_request:
  push:
    branches:
      - feature/restructure-core
      - 'codex/**'
      - 'feature/**'
      - 'beta/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint / python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run flake8 baseline audit
        continue-on-error: true
        run: flake8 core ai xlights tools tests main.py gui_launcher.py --count --statistics

      - name: Run mypy type checking
        run: mypy core ai xlights tools --ignore-missing-imports --show-error-codes || true

      - name: Run bandit security checks
        run: bandit -r core ai xlights tools -f txt || true

  beta-smoke:
    name: full regression audit / python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall core ai xlights tools tests main.py gui_launcher.py

      - name: List sequencing profiles
        run: python main.py --list-profiles

      - name: Run full regression audit
        continue-on-error: true
        run: python -m pytest -q --cov=core --cov=ai --cov=xlights --cov=tools --cov-report=term-missing
