# Isolated owner-review pilot. Does not merge, release, or dispatch the song batch.
name: Drastic Measures native brewery float — owner review
on:
  push:
    branches: [codex/hypnotic-parade-float-20261113]
    paths:
      - '.github/workflows/polar-prism-parade.yml'
      - 'models/parade_float.py'
      - 'models/brewery_branding.py'
      - 'models/brewery_skeleton_band.py'
      - 'tools/brewery_skeleton_cues.py'
      - 'tools/build_current_comparison.py'
      - 'tests/test_parade_float.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: polar-prism-native-one-song
  cancel-in-progress: true
jobs:
  render-one-float:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONPATH: '.'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      XL_NO_GPU_COMPUTE: '1'
      HELIX_NATIVE_PREVIEW_WIDTH: '1920'
      HELIX_NATIVE_PREVIEW_HEIGHT: '1080'
      SOURCE_ID: '1VdhX9WvUFgMNhO8HGpziiG-dcInItegJ'
      SOURCE_SHA256: 'f349d05738ab274a6a37125021a7addae5569f9d074278b351a17c62072a2a0f'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native and DSP dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb xauth openbox wmctrl xdotool x11-utils x11-xserver-utils libgtk-3-0t64 libgl1 libegl1 libopengl0 libglu1-mesa libgstreamer-plugins-base1.0-0
          python -m pip install numpy scipy librosa==0.10.2.post1 soundfile numba llvmlite scikit-learn Pillow trimesh moderngl zstandard imageio imageio-ffmpeg cmudict PyYAML requests pytest gdown==6.4.2
      - name: Compile and execute parade design smoke tests
        run: |
          set -euo pipefail
          python -m compileall -q models/parade_float.py models/brewery_branding.py models/brewery_skeleton_band.py tools/brewery_skeleton_cues.py tools/render_parade_float.py
          python -m pytest -q tests/test_parade_float.py
      - name: Fetch exact original instrumental from Drive
        run: |
          set -euo pipefail
          mkdir -p pilot-source
          python -m gdown "$SOURCE_ID" -O "pilot-source/Polar Prism Parade.mp3"
          echo "$SOURCE_SHA256  pilot-source/Polar Prism Parade.mp3" | sha256sum -c -
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "pilot-source/Polar Prism Parade.mp3"
      - name: Restore pinned native xLights 2026.18
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xlights-src
          key: xlights-native-ubuntu24-2026.18-${{ hashFiles('tools/patch_xlights_native_export.py') }}
          restore-keys: xlights-native-ubuntu24-2026.18-
      - name: Prepare authentic native xLights renderer
        run: |
          set -euo pipefail
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev freeglut3-dev libavcodec-dev libavformat-dev libavfilter-dev libswscale-dev libsdl2-dev libzstd-dev libcurl4-openssl-dev liblua5.3-dev libwebp-dev libsecret-1-dev libegl-dev libfreetype-dev libharfbuzz-dev libfontconfig-dev libavahi-compat-libdnssd-dev libminizip-dev libxlsxwriter-dev cbp2make glslc glslang-dev
          root="$RUNNER_TEMP/xlights-src"
          if [ ! -d "$root/.git" ]; then
            git clone --depth 1 --branch 2026.18 --recurse-submodules https://github.com/xLightsSequencer/xLights.git "$root"
          fi
          cd "$root"
          test "$(git rev-parse HEAD)" = 839c0f590dc454bb7adb8a16c4dd92a70b46156e
          if [ -f wxWidgets-xlights_2026.17c/lib/libwx_gtk3u-3.3.so.4.0.0 ]; then
            sudo make -C wxWidgets-xlights_2026.17c install
            sudo ldconfig
          fi
          if ! python -c "import sys;sys.path.insert(0,'$GITHUB_WORKSPACE');from tools.native_renderer_bundle import validate_tree;validate_tree(__import__('pathlib').Path.cwd())"; then
            git checkout -- src-ui-wx/xLightsMain.cpp src-ui-wx/app-shell/TabSequence.cpp src-ui-wx/graphics/opengl/xlGLCanvas.cpp src-ui-wx/graphics/opengl/xlGLCanvas.h src-ui-wx/graphics/vulkan/xlVulkanCanvas.cpp
            python "$GITHUB_WORKSPACE/tools/patch_xlights_native_export.py" "$root"
            timeout --signal=TERM --kill-after=30s 65m make -j 4
          fi
          test -x "$root/bin/xLights"
          ldd "$root/bin/xLights" | tee "$GITHUB_WORKSPACE/pilot-source/native-ldd.txt"
          ! grep -q 'not found' "$GITHUB_WORKSPACE/pilot-source/native-ldd.txt"
          echo "HELIX_PATCHED_XLIGHTS=$root/bin/xLights" >> "$GITHUB_ENV"
      - name: Cache validated renderer
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/xlights-src
          key: xlights-native-ubuntu24-2026.18-${{ hashFiles('tools/patch_xlights_native_export.py') }}
      - name: Run authentic Helix engine and single native 3D float
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 2560x1440x24' sh -c '
            openbox >pilot-source/openbox.log 2>&1 &
            exec python -m tools.render_parade_float \
              --audio "pilot-source/Polar Prism Parade.mp3" \
              --sha256 "$SOURCE_SHA256" \
              --work "pilot-work/polar-prism" \
              --xlights "$HELIX_PATCHED_XLIGHTS"
          '
      - name: Validate the owner gate and full native video decode
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from tools.phoneme_source import digest
          p=Path('pilot-work/polar-prism/parade_floats_verified.json')
          r=json.loads(p.read_text())
          assert r['source_sha256']=='f349d05738ab274a6a37125021a7addae5569f9d074278b351a17c62072a2a0f'
          assert r['owner_approved'] is False
          native=r['native_receipt']
          movie=Path(native['mp4'])
          assert movie.is_file() and digest(movie)==native['mp4_sha256']
          subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(movie),'-map','0:v:0','-map','0:a:0','-f','null','-'],check=True)
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(movie)]))
          v=next(s for s in info['streams'] if s['codec_type']=='video')
          assert (int(v['width']),int(v['height']))==(1920,1080)
          print('Native video decoded:',movie)
          PY
      - name: Upload verified pilot and editable files only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Drastic-Measures-NATIVE-Float-OWNER-REVIEW
          retention-days: 30
          if-no-files-found: error
          path: |
            pilot-work/polar-prism/parade_floats_verified.json
            pilot-work/polar-prism/parade_layouts/01/run_manifest.json
            pilot-work/polar-prism/parade_layouts/01/Performance.xsq
            pilot-work/polar-prism/parade_layouts/01/xlights_rgbeffects.xml
            pilot-work/polar-prism/parade_layouts/01/xlights_networks.xml
            pilot-work/polar-prism/parade_layouts/01/models/*.xmodel
            pilot-work/polar-prism/parade_layouts/01/native-preview-*/**/*
      - name: Preserve failures as diagnostics, never approval
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Drastic-Measures-FAILED-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: |
            pilot-source/*.log
            pilot-source/*.txt
            pilot-work/polar-prism/**/*.log
            pilot-work/polar-prism/**/*.json
