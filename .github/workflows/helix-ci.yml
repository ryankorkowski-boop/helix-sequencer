name: Helix Beta CI

on:
  pull_request:
  push:
    branches:
      - feature/restructure-core
      - 'codex/**'
      - 'feature/**'
      - 'beta/**'

jobs:
  beta-smoke:
    name: beta smoke / python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall core ai xlights tools tests main.py gui_launcher.py

      - name: List sequencing profiles
        run: python main.py --list-profiles

      - name: Run beta smoke tests
        run: |
          python -m pytest -q \
            tests/test_quality_metrics.py \
            tests/test_native_quality_evidence.py \
            tests/test_native_preview.py \
            tests/test_check_xlights_rest_sequence.py \
            tests/test_sequence_builder.py \
            tests/test_effects_orchestrator_bridge.py \
            tests/test_xlights_contract_validator.py \
            tests/test_explainable_variant_scoring.py \
            tests/test_beat_aligner.py \
            tests/test_vocal_pipeline_integration.py \
            tests/test_export_demo_xsq.py \
            tests/test_preview_hq.py \
            tests/test_render_xsq_skeleton_preview.py \
            tests/test_remote_review_workflow_contract.py \
            tests/test_issue_resolution_workflow_contract.py \
            tests/test_helix_flow_review_artifacts_workflow.py \
            tests/test_export_helix_flow_review_artifacts.py \
            tests/test_birdsong_feature_state.py \
            tests/test_birdsong_phrase_engine.py \
            tests/test_birdsong_motion.py \
            tests/test_birdsong_effect_scoring.py \
            tests/test_birdsong_behavior_planner.py \
            tests/test_birdsong_intent_manifest.py \
            tests/test_birdsong_quality_score.py \
            tests/test_helix_flow_baseline_compare.py \
            tests/test_helix_flow_iteration.py \
            tests/test_helix_flow_acceptance.py \
            tests/test_birdsong_layout_targets.py \
            tests/test_helix_flow_spatial_graph.py \
            tests/test_birdsong_xsq_export.py \
            tests/test_export_birdsong_demo_manifest.py \
            tests/test_wadena_geometry.py \
            tests/test_acoustic_manifold.py \
            tests/test_wadena_preview_mapper.py \
            tests/test_wadena_spatial_graph.py \
            tests/test_wadena_spatial_intent_temporal.py \
            tests/test_wadena_spatial_propagation.py

      - name: Check quality harness formatting and types
        run: |
          python -m flake8 tools/quality tests/test_quality_metrics.py tests/test_native_quality_evidence.py
          python -m mypy --strict --explicit-package-bases --follow-imports=silent tools/quality
          python -m flake8 tools/native_preview.py tools/prepare_native_preview_benchmark.py tests/test_native_preview.py
          python -m mypy --strict --explicit-package-bases --follow-imports=silent tools/native_preview.py tools/prepare_native_preview_benchmark.py

      - name: Score deterministic saved-XSQ benchmark
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          source = Path("tests/fixtures/quality")
          run = Path("test_runs/quality_benchmark")
          run.mkdir(parents=True, exist_ok=True)
          for name in ("benchmark.xsq", "layout.xml", "audio_features.json"):
              shutil.copyfile(source / name, run / name)
          (run / "run_manifest.json").write_text(json.dumps({
              "layout_path": "layout.xml",
              "artifacts": [{"kind": "xsq", "path": "benchmark.xsq"}]
          }))
          PY
          python -m tools.quality score test_runs/quality_benchmark > test_runs/quality_benchmark/quality_report.json

      - name: Upload quality benchmark diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: quality-benchmark-python-${{ matrix.python-version }}
          path: test_runs/quality_benchmark/
