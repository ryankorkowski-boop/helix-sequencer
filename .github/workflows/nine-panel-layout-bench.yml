name: Nine-panel layout bench validation

on:
  push:
    branches:
      - integration/unified-beta-completion-20261117
    paths:
      - 'tools/layout_bench/**'
      - 'fixtures/layout_bench/**'
      - 'tests/test_nine_panel_gate.py'
      - '.github/workflows/nine-panel-layout-bench.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install numpy pillow pytest
      - name: Run locked nine-panel and model zoo regression tests
        run: python -m pytest -q tests/test_nine_panel_gate.py
      - name: Generate layout bench fixtures and parse XML
        run: python -m tools.layout_bench.generate_layouts
      - name: Verify regenerated candidate layout inventory
        run: python -m pytest -q tests/test_layout_bench.py tests/test_nine_panel_gate.py
      - name: Upload model zoo XML and template for inspection
        uses: actions/upload-artifact@v4
        with:
          name: nine-panel-native-model-zoo-candidate
          path: |
            fixtures/layout_bench/native_model_zoo/xlights_rgbeffects.xml
            fixtures/layout_bench/native_model_zoo/template.xsq
            fixtures/layout_bench/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate locked plan structure
        run: python tools/layout_bench/validate_nine_panel.py --structural-only
      - name: Verify approval gate refuses unfinished layouts
        shell: bash
        run: |
          if python tools/layout_bench/validate_nine_panel.py; then
            echo 'ERROR: unfinished layout plan passed approval gate'
            exit 1
          fi
          echo 'Expected: unfinished nine-panel approval blocked'
