name: Owner Drive audio stem qualification
on:
  push:
    branches: [integration/unified-beta-completion-20261117]
    paths:
      - .github/workflows/owner-drive-stem-qualification.yml
      - evidence/beta_completion/new_drive_audio_candidates_20261121.json
      - core/audio_intelligence.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-drive-stems-${{ github.ref }}
  cancel-in-progress: false
jobs:
  separate-full-song:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HELIX_DEMUCS_DEVICE: cpu
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TORCH_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-audio transport
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install gdown==6.4.2
      - name: Fetch and verify full-length owner source
        run: |
          set -euo pipefail
          mkdir -p owner-source
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('evidence/beta_completion/new_drive_audio_candidates_20261121.json').read_text())
          assert len(manifest['sources']) == 2
          short=next(row for row in manifest['sources'] if row['priority']=='full song')
          Path('owner-source/source.env').write_text('SOURCE_ID='+short['drive_file_id']+'\nSOURCE_SHA256='+short['sha256']+'\n')
          PY
          source owner-source/source.env
          python -m gdown "$SOURCE_ID" -O owner-source/Rhythmic_Awe.mp3
          echo "$SOURCE_SHA256  owner-source/Rhythmic_Awe.mp3" | sha256sum -c -
      - name: Verify owner audio duration and channel format before separation
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_name,sample_rate,channels -of json owner-source/Rhythmic_Awe.mp3 > owner-source/audio_probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          info=json.loads(Path('owner-source/audio_probe.json').read_text())
          duration=float(info['format']['duration'])
          streams=[s for s in info.get('streams',[]) if s.get('codec_name')=='mp3']
          assert 252.0 < duration < 255.0, f'Unexpected original song duration: {duration}'
          assert len(streams)==1 and int(streams[0]['sample_rate'])==48000 and int(streams[0]['channels'])==2, streams
          print('Owner Rhythmic Awe source clock and stereo verified:',duration)
          PY
      - name: Check Demucs command syntax before expensive model work
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path('core/audio_intelligence.py').read_text())
          fn=next(n for n in ast.walk(tree) if isinstance(n,ast.FunctionDef) and n.name=='_try_demucs_stem_separation')
          inserts=[n for n in ast.walk(fn) if isinstance(n,ast.Assign) and any(isinstance(t,ast.Subscript) and isinstance(t.value,ast.Name) and t.value.id=='command' for t in n.targets)]
          assert any(isinstance(n.targets[0].slice,ast.Slice) and isinstance(n.targets[0].slice.lower,ast.Constant) and n.targets[0].slice.lower.value==5 for n in inserts), 'Demucs --device must follow -n htdemucs'
          PY
      - name: Separate verified source with production Demucs action
        uses: ./.github/actions/production-audio
        with:
          audio: owner-source/Rhythmic_Awe.mp3
          sha256: 02cd54391e4b20efc805ae5f68b0760eafdc33931c6be14bbcf37b7d851fdba4
      - name: Check real four-stem cache and source-aligned duration
        run: |
          python - <<'PY'
          import hashlib,json,wave
          from pathlib import Path
          source_sha='02cd54391e4b20efc805ae5f68b0760eafdc33931c6be14bbcf37b7d851fdba4'
          root=Path('RenderCache/stems/Rhythmic_Awe')/source_sha
          stems={}
          for name in ('drums','bass','other','vocals'):
              matches=list(root.rglob(name+'.wav'))
              if len(matches)!=1:raise SystemExit(f'Expected one {name}.wav in {root}, got {len(matches)}')
              f=matches[0]
              with wave.open(str(f),'rb') as audio:
                  duration=audio.getnframes()/audio.getframerate()
              if abs(duration-253.44)>1:raise SystemExit(f'Unexpected duration of {name}: {duration}')
              stems[name]={'path':str(f),'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'seconds':duration}
          receipt={'status':'demucs_four_stems_verified','source_sha256':source_sha,'stems':stems,
                   'independent_lead_harmony_verified':False,
                   'approval_mp4_produced':False}
          Path('owner-source/stem_receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Upload source-bound WAVs and separation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-rhythmic-awe-demucs-stems-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            RenderCache/stems/Rhythmic_Awe/
            owner-source/stem_receipt.json
            owner-source/audio_probe.json
            owner-source/source.env
