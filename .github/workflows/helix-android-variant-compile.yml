name: Helix Android Variant Compile

on:
  push:
    branches:
      - 'integration/unified-beta-completion-20261117'
    paths:
      - 'android/**'
      - '.github/workflows/helix-android-variant-compile.yml'
      - 'tools/stage_android_engine.py'
      - 'tools/build_android_python_wheels.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helix-android-variant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: |
          echo "y" | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile debug Java sources
        working-directory: android
        env:
          HELIX_BUILD_PYTHON: python
        run: gradle :app:compileDebugJavaWithJavac --no-daemon --stacktrace
