name: Helix Android Variant Compile

on:
  push:
    branches:
      - 'integration/unified-beta-completion-20261117'
    paths:
      - 'android/**'
      - '.github/workflows/helix-android-variant-compile.yml'
      - 'tools/stage_android_engine.py'
      - 'tools/build_android_python_wheels.py'
      - 'tools/build_helpers/variants.py'
      - 'config/gui_options.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helix-android-variant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No Android SDK command-line tools found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate Android Python entrypoint syntax
        run: python -m py_compile android/app/src/main/python/helix_mobile.py android/app/src/main/python/helix_mp4.py
      - name: Compile debug Java sources
        working-directory: android
        env:
          HELIX_BUILD_PYTHON: python
        run: gradle :app:compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Package unsigned-for-release debug APK (CI verification only)
        working-directory: android
        env:
          HELIX_BUILD_PYTHON: python
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify debug APK payload and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          python - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              broken = archive.testzip()
              if broken:
                  raise SystemExit(f"APK has corrupt entry: {broken}")
              names = archive.namelist()
              required = ["AndroidManifest.xml", "classes.dex"]
              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit(f"APK missing required entries: {missing}")
              if not any(name.startswith("assets/") for name in names):
                  raise SystemExit("APK missing assets")
              print(f"APK ZIP validated: {len(names)} entries, manifest, DEX and assets present")
          PY
          sha256sum "$APK"

      - name: Retain verified debug APK for private acceptance testing
        uses: actions/upload-artifact@v4
        with:
          name: helix-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
