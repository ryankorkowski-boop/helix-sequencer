name: Helix Full Current 256 + Drummer
on:
  push:
    branches: [feature/restructure-core, maintenance/dependency-modernization]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy librosa soundfile numba llvmlite imageio imageio-ffmpeg pillow scikit-learn pytest
      - name: Audio check
        run: |
          test -f 'Helix Audiolights.mp3'
          python - <<'PY'
          import imageio_ffmpeg, subprocess
          p=subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),'-i','Helix Audiolights.mp3','-f','null','-'],capture_output=True)
          assert p.returncode==0
          PY
      - name: Generate current 256
        env: {PYTHONPATH: .}
        run: |
          mkdir -p test_runs/full_current/base256
          python archive/legacy_versions/v28.9.py --template template.xsq --audio 'Helix Audiolights.mp3' --layout-file xlights_rgbeffects.xml --output-dir test_runs/full_current/base256 --variants 1 --single --no-prompt --no-save-settings --no-workspace-history --no-auto-timing-tracks --no-matrix-intelligence --audio-reactive-profile showcase --spatial-awareness 0.35 --chase-style left_to_right --max-layers-per-prop 2
      - name: Emit Sequence Plan shadow sidecar
        env: {PYTHONPATH: .}
        run: |
          python tools/emit_sequence_plan.py             --audio 'Helix Audiolights.mp3'             --layout xlights_rgbeffects.xml             --output test_runs/full_current/sequence_plan.json             --fps 40
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('test_runs/full_current/sequence_plan.json').read_text())
          assert plan['version'] == '0.2'
          assert plan['metadata']['renderer_changed'] is False
          assert plan['source_audio'] == 'Helix Audiolights.mp3'
          print(json.dumps({
              'plan_version': plan['version'],
              'sections': len(plan['sections']),
              'prop_groups': len(plan['prop_groups']),
              'cues': len(plan['cues']),
              'style': plan['style'],
              'renderer_changed': plan['metadata']['renderer_changed'],
          }, indent=2))
          PY
      - name: Detect and inject Drummer V3
        env: {PYTHONPATH: .}
        run: |
          python debug/drum_debug.py 'Helix Audiolights.mp3' --json test_runs/full_current/drum_debug.json
          xsq=$(find test_runs/full_current/base256 -type f -name '*.xsq' | head -n 1)
          test -n "$xsq"
          python tools/integrate_drummer_v3_into_xsq.py "$xsq" 'Helix Audiolights.mp3' --output test_runs/full_current/LightsOutTheme_FULL_256_PLUS_DRUMMER_CURRENT.xsq --report test_runs/full_current/drummer_run_report.json
      - name: Validate XSQ
        env: {PYTHONPATH: .}
        run: python tools/validate_xsq_structure.py test_runs/full_current/LightsOutTheme_FULL_256_PLUS_DRUMMER_CURRENT.xsq
      - name: Validate Drummer V3 mapping contract
        env: {PYTHONPATH: .}
        run: python -m pytest -q tests/test_drummer_v3_xsq_integration.py tests/test_drummer_v3_pose_sheet.py
      - name: Render HQ MP4
        env: {PYTHONPATH: .}
        run: python -m tools.preview_hq test_runs/full_current/LightsOutTheme_FULL_256_PLUS_DRUMMER_CURRENT.xsq --layout xlights_rgbeffects.xml --audio 'Helix Audiolights.mp3' --quality-preset xlights
      - name: Render actual Drummer V3 with soundtrack
        env: {PYTHONPATH: .}
        run: |
          python tools/render_drummer_v3_preview.py             test_runs/full_current/LightsOutTheme_FULL_256_PLUS_DRUMMER_CURRENT.xsq             --audio 'Helix Audiolights.mp3'             --output test_runs/full_current/Helix_Drummer_V3_WITH_MUSIC.mp4             --duration 20             --fps 30
      - name: Upload full render
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: helix-full-current-256-plus-drummer
          path: test_runs/full_current/**/*
          if-no-files-found: warn
