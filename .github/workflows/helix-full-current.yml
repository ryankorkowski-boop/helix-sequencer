name: Helix Full Current 256 + Drummer
on:
  push:
    branches:
      - feature/restructure-core
      - codex/derwin-audio-intelligence-v1
  workflow_dispatch:
concurrency:
  group: helix-full-current-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy librosa soundfile numba llvmlite imageio imageio-ffmpeg pillow scikit-learn pytest demucs
      - name: Audio check
        run: |
          test -f 'Helix Audiolights.mp3'
          python - <<'PY'
          import imageio_ffmpeg, subprocess
          p=subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),'-i','Helix Audiolights.mp3','-f','null','-'],capture_output=True)
          assert p.returncode==0
          PY
      - name: Restore separated-stem cache
        uses: actions/cache@v4
        with:
          path: test_runs/stem_cache
          key: helix-demucs6-${{ runner.os }}-${{ hashFiles('Helix Audiolights.mp3') }}

      - name: Build render layout with real drummer geometry
        env: {PYTHONPATH: .}
        run: |
          mkdir -p test_runs/full_current
          cp xlights_rgbeffects.xml test_runs/full_current/xlights_rgbeffects_full_band.xml
          python - <<'PY'
          from pathlib import Path
          from tools.build_helpers.helixville4_full_band import add_full_helixville4_band_models
          add_full_helixville4_band_models(Path('test_runs/full_current/xlights_rgbeffects_full_band.xml'))
          PY
      - name: Generate current 256
        env: {PYTHONPATH: .}
        run: |
          mkdir -p test_runs/full_current/base256
          python archive/legacy_versions/v28.9.py --template template.xsq --audio 'Helix Audiolights.mp3' --layout-file test_runs/full_current/xlights_rgbeffects_full_band.xml --output-dir test_runs/full_current/base256 --variants 1 --single --no-prompt --no-save-settings --no-workspace-history --no-auto-timing-tracks --no-matrix-intelligence --audio-reactive-profile showcase --spatial-awareness 0.35 --chase-style left_to_right --max-layers-per-prop 2
      - name: Emit Sequence Plan shadow sidecar
        env: {PYTHONPATH: .}
        run: |
          python tools/emit_sequence_plan.py             --audio 'Helix Audiolights.mp3'             --layout test_runs/full_current/xlights_rgbeffects_full_band.xml             --output test_runs/full_current/sequence_plan.json             --fps 40
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('test_runs/full_current/sequence_plan.json').read_text())
          assert plan['version'] == '0.2'
          assert plan['metadata']['renderer_changed'] is False
          assert plan['source_audio'] == 'Helix Audiolights.mp3'
          print(json.dumps({
              'plan_version': plan['version'],
              'sections': len(plan['sections']),
              'prop_groups': len(plan['prop_groups']),
              'cues': len(plan['cues']),
              'style': plan['style'],
              'renderer_changed': plan['metadata']['renderer_changed'],
          }, indent=2))
          PY
      - name: Detect and inject Drummer V3
        env: {PYTHONPATH: .}
        run: |
          python tools/analyze_drum_detection.py             'Helix Audiolights.mp3'             --use-stems             --stem-cache test_runs/stem_cache             --output test_runs/full_current/drum_detection_report.json
          xsq=$(find test_runs/full_current/base256 -type f -name '*.xsq' | head -n 1)
          test -n "$xsq"
          python tools/integrate_drummer_v3_into_xsq.py             "$xsq"             'Helix Audiolights.mp3'             --stem-cache test_runs/stem_cache             --output test_runs/full_current/LightsOutTheme_FULL_256_PLUS_DRUMMER_CURRENT.xsq             --report test_runs/full_current/drummer_run_report.json
      - name: Validate XSQ
        env: {PYTHONPATH: .}
        run: python tools/validate_xsq_structure.py test_runs/full_current/LightsOutTheme_FULL_256_PLUS_DRUMMER_CURRENT.xsq
      - name: Validate Drummer V3 mapping contract
        env: {PYTHONPATH: .}
        run: python -m pytest -q tests/test_drummer_v3_xsq_integration.py tests/test_drummer_v3_pose_sheet.py
      - name: Render HQ MP4
        if: always()
        env: {PYTHONPATH: .}
        run: python -m tools.preview_hq test_runs/full_current/LightsOutTheme_FULL_256_PLUS_DRUMMER_CURRENT.xsq --layout test_runs/full_current/xlights_rgbeffects_full_band.xml --audio 'Helix Audiolights.mp3' --quality-preset xlights
      - name: Validate full-song duration before artifact generation
        if: always()
        env: {PYTHONPATH: .}
        run: |
          python - <<'PY'
          import subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          import imageio_ffmpeg
          audio = Path('Helix Audiolights.mp3')
          ff = imageio_ffmpeg.get_ffmpeg_exe()
          probe = subprocess.run([ff, '-i', str(audio)], capture_output=True, text=True)
          line = next((x for x in probe.stderr.splitlines() if 'Duration:' in x), None)
          assert line, 'could not determine repo song duration'
          value = line.split('Duration:',1)[1].split(',',1)[0].strip()
          h,m,s = value.split(':')
          audio_ms = int(round((int(h)*3600 + int(m)*60 + float(s))*1000))
          assert audio_ms > 60000, f'repo song unexpectedly short: {audio_ms} ms'
          xsq = Path('test_runs/full_current/LightsOutTheme_FULL_256_PLUS_DRUMMER_CURRENT.xsq')
          root = ET.parse(xsq).getroot()
          ends = [int(float(e.get('endTime','0'))) for e in root.findall('.//Effect') if e.get('endTime')]
          xsq_ms = max(ends)
          assert xsq_ms >= int(audio_ms*0.95), f'XSQ ends at {xsq_ms} ms but song is {audio_ms} ms'
          print(f'FULL-SONG VALIDATION: audio_ms={audio_ms} xsq_end_ms={xsq_ms}')
          PY
      - name: Render actual Drummer V3 with soundtrack
        if: always()
        env: {PYTHONPATH: .}
        run: |
          python tools/render_drummer_v3_preview.py             test_runs/full_current/LightsOutTheme_FULL_256_PLUS_DRUMMER_CURRENT.xsq             --audio 'Helix Audiolights.mp3'             --output test_runs/full_current/Helix_Drummer_V3_WITH_MUSIC.mp4             --fps 30
      - name: Validate rendered MP4 durations
        if: always()
        env: {PYTHONPATH: .}
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import imageio_ffmpeg
          ff = imageio_ffmpeg.get_ffmpeg_exe()
          audio = Path('Helix Audiolights.mp3')
          outputs = [
              Path('test_runs/full_current/Helix_Drummer_V3_WITH_MUSIC.mp4'),
              Path('test_runs/full_current/LightsOutTheme_FULL_256_PLUS_DRUMMER_CURRENT.mp4'),
          ]
          def duration_ms(path):
              p=subprocess.run([ff,'-i',str(path)],capture_output=True,text=True)
              line=next(x for x in p.stderr.splitlines() if 'Duration:' in x)
              v=line.split('Duration:',1)[1].split(',',1)[0].strip()
              h,m,s=v.split(':')
              return int(round((int(h)*3600+int(m)*60+float(s))*1000))
          audio_ms=duration_ms(audio)
          for path in outputs:
              ms=duration_ms(path)
              assert abs(ms-audio_ms) <= 1000, f'{path} duration {ms} ms != audio {audio_ms} ms'
              print(f'FULL-SONG MP4 VALIDATION: {path.name} {ms} ms vs audio {audio_ms} ms')
          PY
      - name: Upload full render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helix-full-current-256-plus-drummer
          path: test_runs/full_current/**/*
          if-no-files-found: warn
