name: Local semantic model - actual language fixtures
on:
  push:
    branches: [codex/historical-semantic-recovery-20261018]
    paths:
      - tools/validate_semantic_entailment.py
      - .github/workflows/semantic-language-fixtures.yml
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
jobs:
  language:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-contextual.txt
      - run: python -u -m tools.validate_semantic_entailment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-language-fixtures
          path: semantic_language_fixtures.json
