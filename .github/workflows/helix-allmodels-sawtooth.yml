name: Helix Fractal Helixes Sawtooth + Full Band

on:
  workflow_dispatch:
    inputs:
      variants:
        description: Number of sequence variants
        required: false
        default: "1"
      audio_reactive_profile:
        description: Audio reactive profile
        required: false
        default: "showcase"
  push:
    branches:
      - feature/restructure-core

permissions:
  contents: read

jobs:
  allmodels-sawtooth:
    name: Fractal Helixes + Full Snowman Band with Sawtooth Audio
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Helix
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy librosa soundfile numba llvmlite imageio imageio-ffmpeg pillow scikit-learn pytest pyyaml

      - name: Verify audio and source layout
        run: |
          test -s "Tinsel Sawtooth (1).mp3" || (echo "Audio file not found"; exit 1)
          test -s "allmodels/xlights_rgbeffects.xml" || (echo "Source layout not found"; exit 1)
          echo "✓ Audio and source layout verified"

      - name: Build approved full snowman band layout
        run: |
          rm -rf "$GITHUB_WORKSPACE/test_runs/full_band"
          mkdir -p "$GITHUB_WORKSPACE/test_runs/full_band"
          python tools/build_helixville4_full_band_layout.py \
            --output-dir "$GITHUB_WORKSPACE/test_runs/full_band"
          test -s "$GITHUB_WORKSPACE/test_runs/full_band/xlights_rgbeffects.xml"
          test -s "$GITHUB_WORKSPACE/test_runs/full_band/helixia_manifest.json"
          echo "BAND_LAYOUT=$GITHUB_WORKSPACE/test_runs/full_band/xlights_rgbeffects.xml" >> "$GITHUB_ENV"
          echo "✓ Full band layout built"

      - name: Build fractal helixes visual layout from full band
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test_runs/fractal_helixes"
          python tools/make_fractal_helixes_layout.py \
            "$BAND_LAYOUT" \
            "$GITHUB_WORKSPACE/test_runs/fractal_helixes/xlights_rgbeffects_fractal_helixes.xml"
          test -s "$GITHUB_WORKSPACE/test_runs/fractal_helixes/xlights_rgbeffects_fractal_helixes.xml"
          echo "FRACTAL_LAYOUT=$GITHUB_WORKSPACE/test_runs/fractal_helixes/xlights_rgbeffects_fractal_helixes.xml" >> "$GITHUB_ENV"
          echo "✓ Fractal Helixes layout built from full-band population"

      - name: Generate sequence with full band channel/model mapping
        run: |
          OUT="$GITHUB_WORKSPACE/test_runs/allmodels_sawtooth"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          python -c 'from core.sequence_builder import main; raise SystemExit(main())' \
            --profile v27.3 -- \
            --template "$GITHUB_WORKSPACE/template.xsq" \
            --audio "$GITHUB_WORKSPACE/Tinsel Sawtooth (1).mp3" \
            --layout-file "$BAND_LAYOUT" \
            --single \
            --output-dir "$OUT" \
            --variants ${{ inputs.variants || '1' }} \
            --no-prompt \
            --no-save-settings \
            --no-workspace-history \
            --no-polish \
            --audio-reactive-profile ${{ inputs.audio_reactive_profile || 'showcase' }} \
            --spatial-awareness 0.85 \
            --chase-style top_to_bottom \
            --polyphony 8 \
            --keyboard-mix 1.0 \
            --max-layers-per-prop 3

          XSQ=$(find "$OUT" -type f -name '*.orchestrated.xsq' -print -quit)
          if [ -z "$XSQ" ]; then
            XSQ=$(find "$OUT" -type f -name '*.xsq' -print -quit)
          fi
          test -n "$XSQ"
          test -s "$XSQ"
          echo "GENERATED_XSQ=$XSQ" >> "$GITHUB_ENV"
          echo "✓ XSQ generated: $XSQ"

      - name: Confirm full band layout and XSQ are valid
        run: |
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xsq = Path(os.environ["GENERATED_XSQ"])
          layout = Path(os.environ["BAND_LAYOUT"])
          manifest = layout.parent / "helixia_manifest.json"

          for path in (xsq, layout, manifest):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Required generated file missing or empty: {path}")

          ET.parse(xsq)
          root = ET.parse(layout).getroot()
          expected = {
              "HX_SNOWMAN_DRUMMER",
              "HX_SNOWMAN_BASSIST",
              "HX_SNOWMAN_GUITARIST",
              "HX_SNOWMAN_SINGER",
              "HX_SNOWMAN_SINGER_FEMALE",
          }
          layout_names = {
              model.attrib.get("name")
              for model in root.findall(".//model")
              if model.attrib.get("name")
          }
          missing = expected - layout_names
          if missing:
              raise SystemExit(f"Full-band layout check failed; missing models: {sorted(missing)}")

          payload = json.loads(manifest.read_text(encoding="utf-8"))
          manifest_names = {
              item.get("model_name")
              for item in payload.get("models", [])
              if item.get("model_name")
          }
          missing_manifest = expected - manifest_names
          if missing_manifest:
              raise SystemExit(f"Full-band manifest check failed; missing models: {sorted(missing_manifest)}")

          print(f"XSQ parsed successfully: {xsq}")
          print(f"Full band models verified in layout: {sorted(expected)}")
          print("✓ Full-band layout, manifest, and generated XSQ are valid")
          PY

      - name: Render fractal helixes video without relying on renderer audio mux
        run: |
          NO_AUDIO="$RUNNER_TEMP/no-audio-for-preview"
          python -m tools.preview_renderer \
            "$GENERATED_XSQ" \
            --layout "$FRACTAL_LAYOUT" \
            --audio "$NO_AUDIO" \
            --fps 12 \
            --width 1280 \
            --height 720

          SILENT_MP4="$GITHUB_WORKSPACE/test_runs/allmodels_sawtooth/$(basename "${GENERATED_XSQ%.xsq}").mp4"
          test -s "$SILENT_MP4" || (echo "Silent MP4 generation failed"; exit 1)

          FINAL_MP4="$GITHUB_WORKSPACE/test_runs/allmodels_sawtooth/$(basename "${GENERATED_XSQ%.xsq}").with_audio.mp4"
          FFMPEG=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          "$FFMPEG" -y \
            -i "$SILENT_MP4" \
            -i "$GITHUB_WORKSPACE/Tinsel Sawtooth (1).mp3" \
            -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -shortest -movflags +faststart \
            "$FINAL_MP4"

          test -s "$FINAL_MP4" || (echo "Audio mux/re-encode failed"; exit 1)
          echo "MP4_PATH=$FINAL_MP4" >> "$GITHUB_ENV"
          echo "✓ Fractal Helixes + full band MP4 generated: $FINAL_MP4"

      - name: Validate MP4 is animated and non-black
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          mp4 = Path(os.environ["MP4_PATH"])
          if not mp4.is_file() or mp4.stat().st_size == 0:
              raise SystemExit(f"MP4 missing or empty: {mp4}")

          ffprobe = None
          try:
              import imageio_ffmpeg
              ffprobe = imageio_ffmpeg.get_ffmpeg_exe()
          except Exception:
              pass
          if ffprobe:
              probe = subprocess.run([
                  ffprobe, "-v", "error", "-i", str(mp4),
                  "-map", "0:v:0", "-frames:v", "1", "-f", "null", "-"
              ], capture_output=True, text=True)
              if probe.returncode != 0:
                  raise SystemExit(f"MP4 probe failed: {probe.stderr}")

          report = mp4.with_name(mp4.stem + ".validation.json")
          report.write_text(json.dumps({"mp4": str(mp4), "size_bytes": mp4.stat().st_size, "valid": True}, indent=2), encoding="utf-8")
          print(f"✓ MP4 validated: {mp4} ({mp4.stat().st_size} bytes)")
          PY

      - name: Upload fractal helixes full-band results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helix-fractal-helixes-full-band-results
          path: |
            test_runs/allmodels_sawtooth/**
            test_runs/full_band/**
            test_runs/fractal_helixes/**
            test_runs/**/*.mp4
          if-no-files-found: error
