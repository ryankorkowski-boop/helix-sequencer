name: Helix Fractal Helixes Sawtooth

on:
  workflow_dispatch:
    inputs:
      variants:
        description: Number of sequence variants
        required: false
        default: "1"
      audio_reactive_profile:
        description: Audio reactive profile
        required: false
        default: "showcase"
  push:
    branches:
      - feature/restructure-core

permissions:
  contents: read

jobs:
  allmodels-sawtooth:
    name: Helix Fractal Helixes with Sawtooth Audio
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Helix
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy librosa soundfile numba llvmlite imageio imageio-ffmpeg pillow scikit-learn pytest pyyaml

      - name: Verify audio and layout files
        run: |
          test -s "Tinsel Sawtooth (1).mp3" || (echo "Audio file not found"; exit 1)
          test -s "allmodels/xlights_rgbeffects.xml" || (echo "Layout file not found"; exit 1)
          echo "✓ Audio and allmodels source layout verified"

      - name: Build fractal helixes visual layout
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test_runs/fractal_helixes"
          python tools/make_fractal_helixes_layout.py \
            "$GITHUB_WORKSPACE/allmodels/xlights_rgbeffects.xml" \
            "$GITHUB_WORKSPACE/test_runs/fractal_helixes/xlights_rgbeffects_fractal_helixes.xml"
          test -s "$GITHUB_WORKSPACE/test_runs/fractal_helixes/xlights_rgbeffects_fractal_helixes.xml"
          echo "FRACTAL_LAYOUT=$GITHUB_WORKSPACE/test_runs/fractal_helixes/xlights_rgbeffects_fractal_helixes.xml" >> "$GITHUB_ENV"

      - name: Generate sequence with allmodels channel mapping
        env:
          PYTHONPATH: .
        run: |
          LAYOUT_FILE="$GITHUB_WORKSPACE/allmodels/xlights_rgbeffects.xml"
          OUT="$GITHUB_WORKSPACE/test_runs/allmodels_sawtooth"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          python -c 'from core.sequence_builder import main; raise SystemExit(main())' \
            --profile v27.3 -- \
            --template "$GITHUB_WORKSPACE/template.xsq" \
            --audio "$GITHUB_WORKSPACE/Tinsel Sawtooth (1).mp3" \
            --layout-file "$LAYOUT_FILE" \
            --single \
            --output-dir "$OUT" \
            --variants ${{ inputs.variants || '1' }} \
            --no-prompt \
            --no-save-settings \
            --no-workspace-history \
            --no-polish \
            --audio-reactive-profile ${{ inputs.audio_reactive_profile || 'showcase' }} \
            --spatial-awareness 0.85 \
            --chase-style top_to_bottom \
            --polyphony 8 \
            --keyboard-mix 1.0 \
            --max-layers-per-prop 3

          XSQ=$(find "$OUT" -type f -name '*.xsq' -print -quit)
          test -n "$XSQ"
          test -s "$XSQ"
          echo "GENERATED_XSQ=$XSQ" >> "$GITHUB_ENV"
          echo "✓ XSQ generated: $XSQ"

      - name: Render fractal helixes MP4 preview
        env:
          PYTHONPATH: .
        run: |
          python -m tools.preview_hq "$GENERATED_XSQ" \
            --layout "$FRACTAL_LAYOUT" \
            --audio "$GITHUB_WORKSPACE/Tinsel Sawtooth (1).mp3" \
            --quality-preset xlights \
            --fps 24 \
            --width 1280 \
            --height 720 \
            --audio-reactive

          MP4=$(find test_runs -name "*.mp4" -type f -print -quit)
          test -n "$MP4" || (echo "MP4 generation failed"; exit 1)
          test -s "$MP4" || (echo "MP4 is empty"; exit 1)
          echo "MP4_PATH=$MP4" >> "$GITHUB_ENV"
          echo "✓ Fractal Helixes MP4 generated: $MP4"

      - name: Validate MP4 is animated
        env:
          MP4_PATH: ${{ env.MP4_PATH }}
        run: |
          python - <<'PY'
          import math
          import os
          import numpy as np
          import imageio.v2 as iio

          path = os.environ["MP4_PATH"]
          reader = iio.get_reader(path)
          meta = reader.get_meta_data()
          raw_n = meta.get("nframes", 0)
          n = int(raw_n) if isinstance(raw_n, (int, float)) and math.isfinite(float(raw_n)) else 0
          if n <= 0:
              try:
                  n = int(reader.count_frames())
              except Exception as exc:
                  raise SystemExit(f"MP4 validation failed: could not count frames: {exc}")
          if n < 8:
              raise SystemExit("MP4 validation failed: too few frames")

          sample_ids = np.linspace(0, n - 1, 8, dtype=int)
          frames = [reader.get_data(int(i)).astype(np.float32) for i in sample_ids]
          # Compare the actual visual field, excluding the small HUD/header.
          crops = [f[int(f.shape[0] * 0.15):, :] for f in frames]
          diffs = [float(np.mean(np.abs(crops[i] - crops[i - 1]))) for i in range(1, len(crops))]
          mean_diff = float(np.mean(diffs))
          dark = [float(np.mean(np.mean(c, axis=2) < 8.0)) for c in crops]

          print(f"frame samples={sample_ids.tolist()}")
          print(f"mean scene frame difference={mean_diff:.3f}")
          print(f"dark fractions={dark}")

          if mean_diff < 0.75:
              raise SystemExit("MP4 validation failed: scene is effectively frozen")
          if all(d > 0.995 for d in dark):
              raise SystemExit("MP4 validation failed: scene is effectively black")
          print("✓ Fractal Helixes MP4 contains visible scene motion")
          PY

      - name: Verify outputs
        run: |
          echo "Generated XSQ: $GENERATED_XSQ"
          test -s "$GENERATED_XSQ" || (echo "XSQ verification failed"; exit 1)
          echo "✓ XSQ verified"
          echo "Generated MP4: $MP4_PATH"
          test -s "$MP4_PATH" || (echo "MP4 verification failed"; exit 1)
          echo "✓ MP4 verified"

      - name: Upload fractal helixes results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helix-fractal-helixes-sawtooth-results
          path: |
            test_runs/allmodels_sawtooth/**
            test_runs/fractal_helixes/**
            test_runs/**/*.mp4
          if-no-files-found: error
