name: Helix Android offline beta
on:
  push:
    branches: ['feature/android-offline-app-*']
    paths: ['android/**', 'tools/stage_android_engine.py', 'tools/build_android_python_wheels.py', 'core/**', 'audio/**', 'tests/test_android_offline.py', '.github/workflows/android-offline.yml']
  pull_request:
    paths: ['android/**', 'tools/stage_android_engine.py', 'tools/build_android_python_wheels.py', 'tests/test_android_offline.py', '.github/workflows/android-offline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*.mp3
            !/*.wav
            !/*.zip
            !/*.mp4
            /android/
            /core/
            /audio/
            /animation/
            /effects/
            /music/
            /mapping/
            /models/
            /xlights/
            /tools/
            /export/
            /config/
            /configs/
            /profiles/
            /presets/
            /schemas/
            /knowledge/
            /helix_knowledge/
            /helix_intent/
            /helix_layout/
            /helix_mapping/
            /helix_music/
            /helix_preview/
            /helix_render/
            /helix_sequencer/
            /helix_spatial/
            /helix_style/
            /helix_composers/
            /helix/
            /ai/
            /data/
            /learning/
            /legacy_ac/
            /render/
            /showcase/
            /standards/
            /fixtures/band_geometry/*.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip setuptools wheel
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK and test APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: python ../tools/run_android_device_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Helix-Android-offline-beta
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
            android/app/build/device-proof/**
