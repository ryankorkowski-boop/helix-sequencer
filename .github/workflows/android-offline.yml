name: Helix Android offline beta
on:
  push:
    branches: ['feature/android-offline-app-*', 'codex/gui-branding-and-guidance-20261013', 'codex/beta-final-integration-20261014', 'codex/beta-final-completion-20261014', 'codex/beta-final-hardening-*', 'codex/72h-completion-*', 'codex/eight-hour-recovery-20261019']
    paths: ['android/**', 'config/support_links.json', 'tools/stage_android_engine.py', 'tools/build_android_python_wheels.py', 'tools/package_beta_installers.py', 'tools/collect_beta_installers.py', 'tests/test_beta_installer_bundle.py', '.github/workflows/beta-installer-bundle.yml', '.github/workflows/windows-portable.yml', 'core/**', 'audio/**', 'music/**', 'models/**', 'tests/test_android_offline.py', 'tools/desktop_remote*.py', 'tools/run_remote_transport_smoke_server.py', '.github/workflows/android-offline.yml', '.github/workflows/beta-completion-native.yml']
  pull_request:
    paths: ['android/**', 'config/support_links.json', 'tools/stage_android_engine.py', 'tools/build_android_python_wheels.py', 'core/**', 'audio/**', 'music/**', 'models/**', 'tests/test_android_offline.py', 'tools/desktop_remote*.py', 'tools/run_remote_transport_smoke_server.py', '.github/workflows/android-offline.yml', '.github/workflows/beta-completion-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: helix-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-offline-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            target: default
          - api: 36
            target: google_apis
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HELIX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*.mp3
            !/*.wav
            !/*.zip
            !/*.mp4
            /android/
            /core/
            /audio/
            /animation/
            /effects/
            /music/
            /mapping/
            /models/
            /xlights/
            /tools/
            /export/
            /config/
            /configs/
            /profiles/
            /presets/
            /schemas/
            /knowledge/
            /helix_knowledge/
            /helix_intent/
            /helix_layout/
            /helix_mapping/
            /helix_music/
            /helix_preview/
            /helix_render/
            /helix_sequencer/
            /helix_spatial/
            /helix_style/
            /helix_composers/
            /helix/
            /ai/
            /data/
            /learning/
            /legacy_ac/
            /render/
            /showcase/
            /allmodels/
            /helixville2/
            /helixville3/
            /helixville4/
            /standards/
            /LICENSES/
            /fixtures/band_geometry/*.json
            /tests/test_android_mp4.py
            /tests/test_android_recovery.py
            /tests/test_gui_support_links.py
            /archive/legacy_versions/sequencer_launcher.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify exact Android build source
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); assert actual == os.environ['HELIX_SOURCE_COMMIT'], 'Wrong Android build source ' + actual"
      - run: python -m pip install --upgrade pip setuptools wheel
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare real MP3 and RGB layout test assets without changing sources
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p android/app/src/androidTest/assets
          git show HEAD:'Helix Audiolights.mp3' > "$RUNNER_TEMP/helix-source.mp3"
          ffmpeg -v error -ss 15 -i "$RUNNER_TEMP/helix-source.mp3" -t 8 -c:a libmp3lame android/app/src/androidTest/assets/real-song.mp3
          cp "$RUNNER_TEMP/helix-source.mp3" android/app/src/androidTest/assets/full-song.mp3
          git show HEAD:helixville4/xlights_rgbeffects.xml > android/app/src/androidTest/assets/stability-rgb.xml
      - name: Host parser and output recovery regressions
        run: |
          python -m pip install numpy scipy soundfile pytest Pillow PyYAML
          PYTHONPATH=. python -m pytest -q tests/test_android_mp4.py tests/test_android_recovery.py tests/test_gui_support_links.py
      - name: Build APK and test APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start synthetic desktop transport fixture
        run: |
          PYTHONPATH=. python -m tools.run_remote_transport_smoke_server --jobs "$RUNNER_TEMP/helix-remote-test" > "$RUNNER_TEMP/helix-remote-test.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/helix-remote-test.pid"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: |
            mkdir -p app/build/device-proof
            adb logcat -c || true
            if python ../tools/run_android_device_smoke.py; then
              result=0
            else
              result=$?
            fi
            adb logcat -d -v threadtime > app/build/device-proof/emulator-logcat.txt || true
            adb shell dumpsys activity processes > app/build/device-proof/emulator-processes.txt || true
            exit "$result"
      - name: Stop transport fixture
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/helix-remote-test.pid"; then kill "$(cat "$RUNNER_TEMP/helix-remote-test.pid")" || true; fi
      - name: Independently decode native video and soundtrack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install numpy scipy soundfile Pillow
          PYTHONPATH=. python tools/verify_android_device_proof.py android/app/build/device-proof --output android/app/build/device-proof/decoded
      - name: Verify APK installation compatibility and launch
        if: always()
        run: |
          mkdir -p android/app/build/device-proof
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          root = Path("android/app/build")
          apk_dir = root / "outputs/apk"
          proof = root / "device-proof"
          apksigner = Path(os.environ["ANDROID_HOME"]) / "build-tools/36.0.0/apksigner"
          records = []
          for kind in ("debug", "release"):
              apk = apk_dir / kind / ("app-" + kind + ".apk")
              if not apk.exists():
                  records.append({"variant": kind, "exists": False, "installable": False})
                  continue
              result = subprocess.run([str(apksigner), "verify", "--print-certs", str(apk)], text=True, capture_output=True)
              records.append({"variant": kind, "exists": True, "signature_verified": result.returncode == 0,
                              "certificate_details": result.stdout.strip(), "error": result.stderr.strip(),
                              "installable": result.returncode == 0})
          by_variant = {item["variant"]: item for item in records}
          debug = by_variant.get("debug", {})
          release = by_variant.get("release", {})
          def cert_sha(item):
              for line in item.get("certificate_details", "").splitlines():
                  if "certificate SHA-256 digest:" in line:
                      return line.split(":", 1)[1].strip()
              return None
          debug_sha, release_sha = cert_sha(debug), cert_sha(release)
          report = {"package_id": "org.helixsequencer.android", "variants": records,
                    "debug_to_release_update_compatible": bool(debug_sha and release_sha and debug_sha == release_sha),
                    "warning": "Different certificates cannot update an installed debug APK; an unsigned release APK cannot install."}
          (proof / "apk-install-compatibility.json").write_text(json.dumps(report, indent=2) + "\\n")
          print(json.dumps(report, indent=2))
          PY
      - name: Record artifact integrity and beta signing identity
        if: always()
        run: |
          mkdir -p android/app/build/device-proof
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/device-proof/signing-certificate.txt
          find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec sha256sum {} + > android/app/build/device-proof/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Helix-Android-stability-api-${{ matrix.api }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
            android/app/build/device-proof/**/*.json
            android/app/build/device-proof/**/*.txt
            android/app/build/device-proof/**/*.log
            android/app/build/device-proof/**/*.png

