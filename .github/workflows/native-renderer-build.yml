name: Pinned native renderer build and integrity
'on':
  pull_request:
    paths:
    - .github/workflows/native-renderer-build.yml
    - tools/patch_xlights_native_export.py
    - tools/native_renderer_bundle.py
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: native-renderer-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HELIX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install build bootstrap prerequisites
      run: 'sudo apt-get update -qq

        sudo apt-get install -y libgtk-3-0t64 libgl1 libegl1 libopengl0 libglu1-mesa libgstreamer-plugins-base1.0-0

        '
    - name: Restore compiled pinned native renderer
      id: native-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/xlights-src
        key: xlights-native-ubuntu24-2026.18-${{ hashFiles('tools/patch_xlights_native_export.py') }}
        restore-keys: xlights-native-ubuntu24-2026.18-
    - name: Install checksum pinned native xLights
      run: "mkdir -p \"$RUNNER_TEMP/xlights\"\ncd \"$RUNNER_TEMP/xlights\"\ncurl -fLsS --retry 3 -o xLights.AppImage\
        \ https://github.com/xLightsSequencer/xLights/releases/download/2026.18/xLights-2026.18-x86_64.AppImage\n\
        echo '62affb88b9a9b03cf5164974ac69bcefe35c559719d157b3364e4d4a5ab4214b  xLights.AppImage' | sha256sum -c\
        \ -\nchmod +x xLights.AppImage\n./xLights.AppImage --appimage-extract >/dev/null\n# Compile the source-level\
        \ native export fix; never claim that the\n# unmodified release AppImage honors requested export dimensions.\n\
        sudo apt-get install -y build-essential cmake ninja-build pkg-config \\\n  libgtk-3-dev libgstreamer1.0-dev\
        \ libgstreamer-plugins-base1.0-dev \\\n  freeglut3-dev libavcodec-dev libavformat-dev libavfilter-dev \\\
        \n  libswscale-dev libsdl2-dev libzstd-dev libcurl4-openssl-dev \\\n  liblua5.3-dev libwebp-dev libsecret-1-dev\
        \ libegl-dev \\\n  libfreetype-dev libharfbuzz-dev libfontconfig-dev \\\n  libavahi-compat-libdnssd-dev\
        \ libminizip-dev libxlsxwriter-dev \\\n  cbp2make glslc glslang-dev\nif [ ! -d \"$RUNNER_TEMP/xlights-src/.git\"\
        \ ]; then\n  git clone --depth 1 --branch 2026.18 --recurse-submodules \\\n    https://github.com/xLightsSequencer/xLights.git\
        \ \"$RUNNER_TEMP/xlights-src\"\nfi\ncd \"$RUNNER_TEMP/xlights-src\"\ntest \"$(git rev-parse HEAD)\" = 839c0f590dc454bb7adb8a16c4dd92a70b46156e\n\
        # make installs wxWidgets under /usr, outside the cached source tree.\n# A cache hit on a fresh runner must\
        \ restore that installation too;\n# an executable xLights file alone does not prove a usable runtime.\n\
        if [ -f wxWidgets-xlights_2026.17c/lib/libwx_gtk3u-3.3.so.4.0.0 ]; then\n  sudo make -C wxWidgets-xlights_2026.17c\
        \ install\n  sudo ldconfig\nfi\n# A restore-key cache may contain the previous source patch. Never\n# infer\
        \ current renderer compatibility from an executable alone.\nif python -c \"from pathlib import Path; import\
        \ sys; sys.path.insert(0, '$GITHUB_WORKSPACE'); from tools.native_renderer_bundle import validate_tree;\
        \ validate_tree(Path.cwd())\"; then\n  echo \"HELIX_PATCHED_XLIGHTS=$RUNNER_TEMP/xlights-src/bin/xLights\"\
        \ >> \"$GITHUB_ENV\"\n  exit 0\nfi\n# Reuse previous object files, but restore only our two pinned source\n\
        # sites before applying this revision's verified native patch.\ngit checkout -- src-ui-wx/xLightsMain.cpp\
        \ src-ui-wx/app-shell/TabSequence.cpp\npython \"$GITHUB_WORKSPACE/tools/patch_xlights_native_export.py\"\
        \ \"$RUNNER_TEMP/xlights-src\"\n# Capture actionable compiler errors even when GitHub's live job logs\n\
        # are unavailable, and cap a stalled compile before job timeout.\nset -o pipefail\n# Allow the pinned native\
        \ build to finish within the job's 60-minute limit.\n# The previous 35-minute cap terminated compilation\
        \ before rendering began.\ntimeout --signal=TERM --kill-after=30s 48m make -j 4 2>&1 | tee \"$GITHUB_WORKSPACE/xlights-native-build.log\"\
        \ntest -x bin/xLights\necho \"HELIX_PATCHED_XLIGHTS=$RUNNER_TEMP/xlights-src/bin/xLights\" >> \"$GITHUB_ENV\"\
        \n"
    - name: Validate restored native runtime dependencies
      run: "ldd \"$HELIX_PATCHED_XLIGHTS\" | tee native-runtime-libraries.log\npython - <<'PY'\nfrom pathlib import\
        \ Path\nreport = Path('native-runtime-libraries.log').read_text()\nif 'not found' in report:\n    raise\
        \ SystemExit('Native renderer has unresolved shared libraries; see native-runtime-libraries.log')\nPY\n"
    - name: Preserve completed native build before export acceptance
      if: steps.native-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/xlights-src
        key: xlights-native-ubuntu24-2026.18-${{ hashFiles('tools/patch_xlights_native_export.py') }}
    - name: Preserve the exact compiled renderer for local source renders
      run: "mkdir -p phoneme-work/runtime\ncp \"$HELIX_PATCHED_XLIGHTS\" phoneme-work/runtime/xLights\nstrip --strip-unneeded\
        \ phoneme-work/runtime/xLights\ncp tools/patch_xlights_native_export.py phoneme-work/runtime/\npython -\
        \ <<'PYCODE'\nimport hashlib, json, os\nfrom pathlib import Path\ndef sha(path):\n    with Path(path).open('rb')\
        \ as stream:\n        return hashlib.file_digest(stream, 'sha256').hexdigest()\nreceipt = dict(upstream_commit='839c0f590dc454bb7adb8a16c4dd92a70b46156e',\n\
        \    source_commit=os.environ['HELIX_SOURCE_COMMIT'],\n    patch_sha256=sha('tools/patch_xlights_native_export.py'),\n\
        \    original_binary_sha256=sha(os.environ['HELIX_PATCHED_XLIGHTS']),\n    stripped_binary_sha256=sha('phoneme-work/runtime/xLights'),\n\
        \    libraries='native-runtime-libraries.log; retain pinned2026.18 resources and compatible wxWidgets')\n\
        Path('phoneme-work/runtime/renderer.json').write_text(json.dumps(receipt, indent=2)+'\\n')\nPYCODE\n"
    - name: Preserve renderer and compiler diagnostics independently of show preparation
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: helix-native-renderer-${{ github.event.pull_request.head.sha || github.sha }}
        path: 'phoneme-work/runtime/

          xlights-native-build.log

          native-runtime-libraries.log

          '
        if-no-files-found: error
