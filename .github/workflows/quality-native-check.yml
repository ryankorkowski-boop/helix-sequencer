name: Native xLights Quality Benchmark

on:
  pull_request:
    paths:
      - 'tools/quality/**'
      - 'tools/native_preview.py'
      - 'tools/prepare_native_preview_benchmark.py'
      - 'tools/check_xlights_rest_sequence.py'
      - 'tests/test_native_preview.py'
      - 'core/section*.py'
      - 'core/effect_engine.py'
      - 'tools/section_composer_benchmark.py'
      - 'tests/test_section_composer.py'
      - 'tests/fixtures/quality/**'
      - '.github/workflows/quality-native-check.yml'
  push:
    branches: ['codex/quality-metrics-20261016', 'codex/native-audio-preview-20261016', 'codex/section-composer-20261016']
    paths:
      - 'tools/quality/**'
      - 'tools/native_preview.py'
      - 'tools/prepare_native_preview_benchmark.py'
      - 'tools/check_xlights_rest_sequence.py'
      - 'tests/test_native_preview.py'
      - 'core/section*.py'
      - 'core/effect_engine.py'
      - 'tools/section_composer_benchmark.py'
      - 'tests/test_section_composer.py'
      - 'tests/fixtures/quality/**'
      - '.github/workflows/quality-native-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-channel-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install virtual display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libegl1 libopengl0 libglu1-mesa libgtk-3-0t64 ffmpeg
          python -m pip install pytest librosa
      - name: Fetch pinned official xLights 2026.18
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p xlights-native
          cd xlights-native
          curl --fail --location --retry 2 --output xLights.AppImage https://github.com/xLightsSequencer/xLights/releases/download/2026.18/xLights-2026.18-x86_64.AppImage
          sha256sum --check <<'SHA'
          62affb88b9a9b03cf5164974ac69bcefe35c559719d157b3364e4d4a5ab4214b  xLights.AppImage
          SHA
          chmod u+x xLights.AppImage
          ./xLights.AppImage --appimage-extract > extract.log
      - name: Prepare clean-room benchmark show
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          run = Path('test_runs/quality_native')
          run.mkdir(parents=True, exist_ok=True)
          source = Path('tests/fixtures/quality')
          shutil.copyfile(source / 'benchmark.xsq', run / 'benchmark.xsq')
          shutil.copyfile(source / 'layout.xml', run / 'xlights_rgbeffects.xml')
          PY
      - name: Render with native xLights
        run: |
          native_exit=0
          xvfb-run -a "$RUNNER_TEMP/xlights-native/squashfs-root/AppRun" \
            --headless --quiet --show "$PWD/test_runs/quality_native" \
            --outputdir "$PWD/test_runs/quality_native" \
            "$PWD/test_runs/quality_native/benchmark.xsq" \
            > test_runs/quality_native/native_render.log 2>&1 || native_exit=$?
          cat test_runs/quality_native/native_render.log
          exit "$native_exit"
      - name: Inspect native channel data and verify effect windows
        run: |
          python -m tools.quality.native test_runs/quality_native/benchmark.fseq \
            --expected-channels 4 --expected-duration-ms 4000 \
            --require-nonzero --output test_runs/quality_native/native_report.json
          python - <<'PY'
          from pathlib import Path
          from tools.quality.native import read_frames
          data, channels, frames, step = read_frames(
              Path('test_runs/quality_native/benchmark.fseq'))
          assert (channels, frames, step) == (4, 80, 50)
          def frame(ms):
              i = ms // step * channels
              return list(data[i:i + channels])
          assert frame(0) == [255, 0, 0, 0]
          assert 0 < frame(500)[0] < frame(0)[0]
          assert frame(1000) == [255, 0, 0, 255]
          assert frame(2000) == [0, 0, 0, 0]
          assert frame(2500) == [204, 204, 0, 0]
          assert frame(3000) == [0, 0, 0, 0]
          PY
      - name: Native House Preview with original audio
        run: |
          python -m tools.prepare_native_preview_benchmark test_runs/native_audio_preview
          xvfb-run -a python -m tools.native_preview test_runs/native_audio_preview \
            --xsq test_runs/native_audio_preview/benchmark.xsq \
            --audio test_runs/native_audio_preview/original.wav \
            --xlights "$RUNNER_TEMP/xlights-native/squashfs-root/AppRun"
      - name: Verify native MP4 audio/video streams and timeline
        env:
          HELIX_NATIVE_PREVIEW_MANIFEST: test_runs/native_audio_preview/run_manifest.json
        run: python -m pytest -q tests/test_native_preview.py tests/test_check_xlights_rest_sequence.py tests/test_native_quality_evidence.py
      - name: Native section composer before and after (original AC benchmark)
        run: |
          python -m tools.section_composer_benchmark test_runs/section_composer_native
          for variant in baseline composed; do
            xvfb-run -a python -m tools.native_preview "test_runs/section_composer_native/$variant" \
              --xsq "test_runs/section_composer_native/$variant/benchmark.xsq" \
              --audio test_runs/section_composer_native/original.wav \
              --xlights "$RUNNER_TEMP/xlights-native/squashfs-root/AppRun"
          done
      - name: Verify section metric gain and actual native channels/audio
        env:
          HELIX_SECTION_COMPOSER_BENCHMARK: test_runs/section_composer_native
        run: python -m pytest -q tests/test_section_composer.py
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-native-xlights-2026.18
          path: |
            test_runs/quality_native/
            test_runs/native_audio_preview/
            test_runs/section_composer_native/
          if-no-files-found: warn
