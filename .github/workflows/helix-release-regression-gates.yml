name: Helix Release Regression Gates

on:
  workflow_dispatch:
  push:
    branches:
      - codex/eight-hour-recovery-20261019
    paths:
      - 'core/**'
      - 'ai/**'
      - 'xlights/**'
      - 'tests/**'
      - '.github/workflows/helix-release-regression-gates.yml'

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: vocal-pipeline
            tests: tests/test_vocal_pipeline_integration.py
          - gate: xlights-export-contract
            tests: tests/test_xlights_contract_validator.py tests/test_export_demo_xsq.py
          - gate: effects-orchestration
            tests: tests/test_sequence_builder.py tests/test_effects_orchestrator_bridge.py
          - gate: preview-render-contract
            tests: tests/test_preview_hq.py tests/test_render_xsq_skeleton_preview.py
          - gate: musical-timing
            tests: tests/test_beat_aligner.py tests/test_explainable_variant_scoring.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run targeted regression gate
        run: python -m pytest -q ${{ matrix.tests }} --junitxml=gate-results.xml
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.gate }}
          path: gate-results.xml
          if-no-files-found: ignore
