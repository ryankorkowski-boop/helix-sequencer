# OWNER APPROVAL GATE: ONE verified Wub Wub Wonderland source only; never dispatch the 82-song batch.
# Canonical V3 drummer and all four advanced finale props are required.
name: Wub Wub Wonderland nine-panel OWNER approval pilot (native)
on:
  push:
    branches: [review/beta14-consolidated-20261125]
    paths: [.github/workflows/wub-wub-native-nine-panel-review.yml]
  pull_request:
    paths: [.github/workflows/wub-wub-native-nine-panel-review.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: wub-wub-nine-panel-owner-pilot-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  render-one-owner-pilot:
    if: github.event_name != 'pull_request' || github.head_ref == 'review/beta14-consolidated-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TORCH_NUM_THREADS: '2'
      HELIX_DEMUCS_DEVICE: cpu
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      OPENBLAS_NUM_THREADS: '2'
      XL_NO_GPU_COMPUTE: '1'
      HELIX_NATIVE_PREVIEW_WIDTH: '1920'
      HELIX_NATIVE_PREVIEW_HEIGHT: '1080'
      HELIX_DRIVE_SOURCE_ID: ${{ secrets.HELIX_WUB_WUB_DRIVE_ID }}
      HELIX_DRIVE_SOURCE_SHA256: '76641340a2a59c5797b333cd36b1e108f503017d190510fbe8da9931ea3f9abc'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Require private source locator
        run: |
          if [ -z "$HELIX_DRIVE_SOURCE_ID" ]; then
            echo "::error::Configure repository secret HELIX_WUB_WUB_DRIVE_ID with the selected original Drive file ID."
            exit 1
          fi
      - name: Install Helix DSP and native preview requirements
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb xauth openbox wmctrl xdotool x11-utils x11-xserver-utils libgtk-3-0t64 libgl1 libegl1 libopengl0 libglu1-mesa libgstreamer-plugins-base1.0-0
          python -m pip install scipy scikit-learn Pillow trimesh moderngl zstandard imageio imageio-ffmpeg cmudict PyYAML requests pytest gdown==6.4.2
      - name: Retrieve actual owner Drive Wub Wub Wonderland audio (no substitute)
        run: |
          set -euo pipefail
          mkdir -p pilot-source
          python -m gdown "$HELIX_DRIVE_SOURCE_ID" -O pilot-source/Wub_Wub_Wonderland_original.mp3
          echo "$HELIX_DRIVE_SOURCE_SHA256  pilot-source/Wub_Wub_Wonderland_original.mp3" | sha256sum -c -
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 pilot-source/Wub_Wub_Wonderland_original.mp3
      - name: Separate genuine original source
        uses: ./.github/actions/production-audio
        with:
          audio: pilot-source/Wub_Wub_Wonderland_original.mp3
          sha256: ${{ env.HELIX_DRIVE_SOURCE_SHA256 }}
      - name: Separate candidate lead and harmony from actual combined vocal stem
        run: |
          set -euo pipefail
          python -m pip install 'audio-separator==0.41.1' 'onnxruntime==1.23.2'
          VOCALS="$(find RenderCache/stems/Wub_Wub_Wonderland_original -name vocals.wav -type f -print -quit)"
          test -s "$VOCALS"
          ROOT=pilot-source/roformer
          mkdir -p "$ROOT"
          audio-separator "$VOCALS" --model_filename mel_band_roformer_karaoke_aufr33_viperx_sdr_10.1956.ckpt --output_format WAV --output_dir "$ROOT"
          LEAD="$(find "$ROOT" -maxdepth 1 -name '*Vocals*.wav' -printf '%f\n' | head -n 1)"
          BACKING="$(find "$ROOT" -maxdepth 1 -name '*Instrumental*.wav' -printf '%f\n' | head -n 1)"
          test -n "$LEAD" && test -n "$BACKING"
          python -m tools.separate_vocal_roles --source pilot-source/Wub_Wub_Wonderland_original.mp3 --vocals "$VOCALS" --output-dir "$ROOT" --skip-separation --lead-output "$LEAD" --backing-output "$BACKING"
      - name: Select source-bound 30-second candidate with independent and overlapping vocal activity
        run: |
          set -euo pipefail
          python -m tools.select_vocal_review_excerpt pilot-source/Wub_Wub_Wonderland_original.mp3 pilot-source/roformer/vocal_separation_manifest.json pilot-source/Wub_Wub_review.wav pilot-vocal-fixture
          echo "HELIX_REVIEW_SHA256=$(sha256sum pilot-source/Wub_Wub_review.wav | cut -d ' ' -f1)" >> "$GITHUB_ENV"
      - name: Prepare source-bound excerpt for actual Helix sequencing
        uses: ./.github/actions/production-audio
        with:
          audio: pilot-source/Wub_Wub_review.wav
          sha256: ${{ env.HELIX_REVIEW_SHA256 }}
      - name: Validate the hero layouts and source-event policy
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_nine_panel_showcase.py tests/test_full_song_advanced_showcase.py tests/test_source_spatial_direction.py
          python -m compileall -q models/nine_panel_showcase.py models/advanced_full_song_showcase.py models/full_song_layouts.py tools/render_full_song_comparison.py
      - name: Restore pinned native xLights 2026.18 build
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xlights-src
          key: xlights-native-ubuntu24-2026.18-${{ hashFiles('tools/patch_xlights_native_export.py') }}
          restore-keys: xlights-native-ubuntu24-2026.18-
      - name: Validate or build authentic patched native xLights
        run: |
          set -euo pipefail
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev freeglut3-dev libavcodec-dev libavformat-dev libavfilter-dev libswscale-dev libsdl2-dev libzstd-dev libcurl4-openssl-dev liblua5.3-dev libwebp-dev libsecret-1-dev libegl-dev libfreetype-dev libharfbuzz-dev libfontconfig-dev libavahi-compat-libdnssd-dev libminizip-dev libxlsxwriter-dev cbp2make glslc glslang-dev
          root="$RUNNER_TEMP/xlights-src"
          if [ ! -d "$root/.git" ]; then
            git clone --depth 1 --branch 2026.18 --recurse-submodules https://github.com/xLightsSequencer/xLights.git "$root"
          fi
          cd "$root"
          test "$(git rev-parse HEAD)" = 839c0f590dc454bb7adb8a16c4dd92a70b46156e
          if [ -f wxWidgets-xlights_2026.17c/lib/libwx_gtk3u-3.3.so.4.0.0 ]; then
            sudo make -C wxWidgets-xlights_2026.17c install
            sudo ldconfig
          fi
          if ! python -c "import sys;sys.path.insert(0,'$GITHUB_WORKSPACE');from tools.native_renderer_bundle import validate_tree;validate_tree(__import__('pathlib').Path.cwd())"; then
            git checkout -- src-ui-wx/xLightsMain.cpp src-ui-wx/app-shell/TabSequence.cpp src-ui-wx/graphics/opengl/xlGLCanvas.cpp src-ui-wx/graphics/opengl/xlGLCanvas.h src-ui-wx/graphics/vulkan/xlVulkanCanvas.cpp
            python "$GITHUB_WORKSPACE/tools/patch_xlights_native_export.py" "$root"
            timeout --signal=TERM --kill-after=30s 65m make -j 4
          fi
          test -x "$root/bin/xLights"
          ldd "$root/bin/xLights" | tee "$GITHUB_WORKSPACE/pilot-source/native-ldd.txt"
          ! grep -q 'not found' "$GITHUB_WORKSPACE/pilot-source/native-ldd.txt"
          echo "HELIX_PATCHED_XLIGHTS=$root/bin/xLights" >> "$GITHUB_ENV"
      - name: Preserve working native renderer in cross-run cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/xlights-src
          key: xlights-native-ubuntu24-2026.18-${{ hashFiles('tools/patch_xlights_native_export.py') }}
      - name: Run the actual full Helix engine then native xLights nine-panel export
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 2560x1440x24' sh -c '
            openbox >pilot-source/openbox.log 2>&1 &
            exec python -m tools.render_full_song_comparison \
              pilot-source/Wub_Wub_review.wav \
              pilot-work/wub-wub-nine-panel \
              --expected-sha256 "$HELIX_REVIEW_SHA256" \
              --nine-panel --vocal-fixture pilot-vocal-fixture --xlights "$HELIX_PATCHED_XLIGHTS"
          '
      - name: Expose sequencer failure details
        if: failure()
        run: |
          find pilot-work -name sequencer.log -type f -print -exec tail -n 130 {} \; || true
      - name: Verify nine genuine panels and keep owner acceptance pending
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('pilot-work/wub-wub-nine-panel')
          p = json.loads((root/'comparison_manifest.json').read_text())
          assert p['status'] == 'technically_verified'
          assert p['owner_approved'] is False
          assert p['audio_sha256'] == os.environ['HELIX_REVIEW_SHA256']
          assert len(p['panels']) == 9
          assert len({r['layout_sha256'] for r in p['panels']}) == 9
          assert len({r['fseq_sha256'] for r in p['panels']}) == 9
          assert (root/'Nine_Panel_30s_Comparison.mp4').stat().st_size > 1000000
          receipt = {'status':'ESTIMATED_VOCAL_REVIEW_ONLY','batch_allowed':False,
                     'source':'actual Helix master + pinned xLights native renderer',
                     'excerpt_audio_sha256':p['audio_sha256'], 'original_audio_sha256':os.environ['HELIX_DRIVE_SOURCE_SHA256'], 'excerpt_start_seconds':json.loads(Path('pilot-vocal-fixture/excerpt_selection.json').read_text())['start_seconds'], 'excerpt_duration_seconds':30,
                     'panel_count':9,'manifest':'comparison_manifest.json'}
          (root/'OWNER_APPROVAL_GATE.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Audit decoded native video for white/blank/frozen frames
        if: success()
        run: |
          set +e
          python -m tools.check_mp4_visual_quality \
            pilot-work/wub-wub-nine-panel/Nine_Panel_30s_Comparison.mp4 \
            --report pilot-work/wub-wub-nine-panel/VISUAL_QUALITY_RECEIPT.json --fps 2
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::warning::Native video visual quality flagged; retain receipt for owner review, do not imply approval."
          fi
          test -s pilot-work/wub-wub-nine-panel/VISUAL_QUALITY_RECEIPT.json
      - name: Upload only the verified one-song approval package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Wub-Wub-Wonderland-30s-9-Panel-OWNER-REVIEW
          retention-days: 30
          if-no-files-found: error
          path: |
            pilot-work/wub-wub-nine-panel/Nine_Panel_30s_Comparison.mp4
            pilot-work/wub-wub-nine-panel/comparison_manifest.json
            pilot-work/wub-wub-nine-panel/panel_activity.json
            pilot-work/wub-wub-nine-panel/OWNER_APPROVAL_GATE.json
            pilot-work/wub-wub-nine-panel/VISUAL_QUALITY_RECEIPT.json
            pilot-work/wub-wub-nine-panel/layouts/**/run_manifest.json
            pilot-work/wub-wub-nine-panel/layouts/**/*.xsq
            pilot-work/wub-wub-nine-panel/layouts/**/*.mp4
            pilot-work/wub-wub-nine-panel/layouts/**/*.fseq
            pilot-work/wub-wub-nine-panel/layouts/**/xlights_rgbeffects.xml
            pilot-vocal-fixture/diagnostic.json
            pilot-vocal-fixture/excerpt_selection.json
            pilot-source/roformer/vocal_separation_manifest.json
      - name: Retain only diagnostic logs on failure, never label as approval
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Wub-Wub-Wonderland-9-Panel-FAILED-DIAGNOSTICS
          retention-days: 14
          if-no-files-found: warn
          path: |
            RenderCache/stems/**/*.log
            pilot-source/*.txt
            pilot-source/*.log
            pilot-source/roformer/*.json
            pilot-vocal-fixture/*.json
            pilot-work/wub-wub-nine-panel/**/*.log
            pilot-work/wub-wub-nine-panel/**/*.json
