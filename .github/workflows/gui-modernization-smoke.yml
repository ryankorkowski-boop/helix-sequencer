name: GUI modernization smoke
on:
  push:
    branches:
      - feature/animated-progress-ui-20261116
  pull_request:
    paths:
      - 'gui_launcher.py'
      - 'gui_lightshow.py'
      - 'tests/test_gui_modernization_smoke.py'
      - 'android/app/src/main/java/org/helixsequencer/android/**'
      - '.github/workflows/gui-modernization-smoke.yml'
jobs:
  desktop-headless:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p test_gui_modernization_smoke.py -v
      - run: python -m py_compile gui_launcher.py gui_lightshow.py gui_launcher_drummer.py
      - name: Drummer mapping regression
        run: python -m unittest discover -s tests -p test_drum_mapping.py -v
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-windows-portable.txt
      - name: Install complete portable runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows-portable.txt
          python -m pip install pytest
      - name: Verify release version and palette
        run: python -m pytest -q tests/test_helix_version.py tests/test_palette_not_white.py
      - name: Build full GUI and CLI worker
        run: python -m PyInstaller --noconfirm --clean windows_portable.spec
      - name: Check packaged files and CLI version
        shell: pwsh
        run: |
          $root = 'dist/Helix'
          foreach ($name in @('Helix.exe', 'HelixCLI.exe', '_internal/template.xsq')) {
            if (-not (Test-Path "$root/$name")) { throw "Missing $name" }
          }
          & "$root/HelixCLI.exe" --version | Tee-Object -Variable versionText
          if ($LASTEXITCODE -ne 0 -or ($versionText -join ' ') -notmatch '1\.4\.0-beta') {
            throw 'Packaged worker did not report Beta 1.4'
          }
          Copy-Item "$root/_internal/template.xsq" "$root/template.xsq" -Force
          if (Test-Path "$root/_internal/xlights_rgbeffects.xml") {
            Copy-Item "$root/_internal/xlights_rgbeffects.xml" "$root/xlights_rgbeffects.xml" -Force
          }
          foreach ($name in @('WINDOWS_PORTABLE_README.txt', 'THIRD_PARTY_LICENSES.md', 'NOTICE', 'LICENSE', 'CHANGELOG.md')) {
            if (Test-Path "$root/_internal/$name") { Copy-Item "$root/_internal/$name" "$root/$name" -Force }
          }
          New-Item -ItemType Directory -Force -Path "$root/outputs" | Out-Null
      - name: Exercise packaged palette engine
        shell: pwsh
        run: |
          python tools/palette_smoke.py --output palette-smoke --runner dist/Helix/HelixCLI.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged palette smoke failed' }
      - name: Assemble Beta 1.4 ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Helix -DestinationPath Helix-Windows-Beta-v1.4.zip -CompressionLevel Optimal
          $hash = (Get-FileHash Helix-Windows-Beta-v1.4.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Helix-Windows-Beta-v1.4.zip" | Set-Content -Encoding ascii Helix-Windows-Beta-v1.4.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: helix-windows-beta-v1.4-candidate
          path: |
            Helix-Windows-Beta-v1.4.zip
            Helix-Windows-Beta-v1.4.sha256
            palette-smoke/palette-smoke.json
          if-no-files-found: error
          retention-days: 14
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/cmdline-tools" || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android debug
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: helix-gui-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
