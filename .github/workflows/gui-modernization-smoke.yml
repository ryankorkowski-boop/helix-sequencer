name: GUI modernization smoke
on:
  push:
    branches:
      - feature/animated-progress-ui-20261116
  pull_request:
    paths:
      - 'gui_launcher.py'
      - 'gui_lightshow.py'
      - 'tests/test_gui_modernization_smoke.py'
      - 'android/app/src/main/java/org/helixsequencer/android/**'
      - '.github/workflows/gui-modernization-smoke.yml'
jobs:
  desktop-headless:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p test_gui_modernization_smoke.py -v
      - run: python -m py_compile gui_launcher.py gui_lightshow.py gui_launcher_drummer.py
      - name: Drummer mapping regression
        run: python -m unittest discover -s tests -p test_drum_mapping.py -v
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller
      - name: Build desktop launcher executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name HelixGuiReview gui_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: helix-gui-windows-review
          path: dist/HelixGuiReview.exe
          if-no-files-found: error
          retention-days: 7
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/cmdline-tools" || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android debug
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: helix-gui-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
