name: GUI modernization smoke
on:
  push:
    branches:
      - feature/animated-progress-ui-20261116
  pull_request:
    paths:
      - 'gui_launcher.py'
      - 'gui_lightshow.py'
      - 'tests/test_gui_modernization_smoke.py'
      - 'android/app/src/main/java/org/helixsequencer/android/**'
      - '.github/workflows/gui-modernization-smoke.yml'
jobs:
  desktop-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_gui_modernization_smoke.py -v
      - run: python -m py_compile gui_launcher.py gui_lightshow.py gui_launcher_drummer.py
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Compile Android debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
