name: Native snowman geometry evidence
on:
  push:
    paths:
      - 'tools/audit_native_snowman_geometry.py'
      - 'tests/test_audit_native_snowman_geometry.py'
      - '.github/workflows/native-snowman-geometry-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model/test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install trimesh
      - name: Verify exact native submodels and exported coordinates
        run: python -m pytest -q tests/test_audit_native_snowman_geometry.py
      - name: Export actual native model positions
        run: python -m tools.audit_native_snowman_geometry --output-dir build/native_snowman_audit
      - name: Preserve audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-snowman-geometry-source-evidence
          path: build/native_snowman_audit/
          if-no-files-found: warn
