name: Showcase recovery guards
on:
  pull_request:
    paths:
      - 'core/show_export_request.py'
      - 'tests/test_show_export_request.py'
      - 'tools/build_spatial_review.py'
      - 'tools/native_source_pose_band.py'
      - 'tests/test_source_instrument_light_curves.py'
      - 'tests/test_hihat_foot_pose.py'
      - 'tests/test_keyboard_orientation.py'
      - 'tests/test_native_instrument_channel_ownership.py'
      - 'tools/audit_showcase_artifacts.py'
      - 'tools/verify_showcase_audio_identity.py'
      - 'tools/verify_native_proof_archive.py'
      - 'tools/verify_xlights_showcase_media.py'
      - 'tests/test_audit_showcase_artifacts.py'
      - 'tests/test_verify_showcase_audio_identity.py'
      - 'tests/test_verify_native_proof_archive.py'
      - 'tests/test_verify_xlights_showcase_media.py'
      - '.github/workflows/showcase-recovery-guards.yml'
  workflow_dispatch:
jobs:
  recovery-guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run source instrument and pose regressions
        run: |
          python -m pytest -q \
            tests/test_source_instrument_light_curves.py \
            tests/test_hihat_foot_pose.py \
            tests/test_keyboard_orientation.py \
            tests/test_native_instrument_channel_ownership.py
      - name: Run export-selection contract tests
        run: python -m pytest -q tests/test_show_export_request.py
      - name: Run recovery regression tests
        run: python -m unittest discover -s tests -p 'test_*showcase*artifacts.py' -v
      - name: Run audio provenance regression tests
        run: python -m unittest discover -s tests -p 'test_verify_showcase_audio_identity.py' -v
      - name: Run xLights musical media regression tests
        run: python -m unittest discover -s tests -p 'test_verify_xlights_showcase_media.py' -v
      - name: Run native archive regression tests
        run: python -m unittest discover -s tests -p 'test_verify_native_proof_archive.py' -v
