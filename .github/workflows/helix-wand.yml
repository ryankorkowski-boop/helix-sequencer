name: Helix Wand

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Preview/test duration
        required: false
        default: "20"
      audio_source:
        description: Optional repo-relative audio file; blank uses deterministic ground truth
        required: false
        default: ""
      layout:
        description: xLights layout path
        required: false
        default: "allmodels/xlights_rgbeffects.xml"
      run_drummer:
        description: Run drummer and submodel validation
        required: false
        default: "true"
      birdsongs_enabled:
        description: Run Birdsongs/spatial event contribution
        required: false
        default: "true"
      render_3d_enabled:
        description: Render synchronized MP4 preview
        required: false
        default: "true"
      quality_preset:
        description: Render quality preset
        required: false
        default: "preview"

permissions:
  contents: read

jobs:
  helix-wand:
    name: Cloud Helix runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      HELIX_DURATION: ${{ inputs.duration_seconds || '20' }}
    steps:
      - name: Checkout Helix
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy librosa soundfile numba llvmlite imageio imageio-ffmpeg pillow scikit-learn pytest pyyaml

      - name: Compile Helix runtime
        run: |
          python -m compileall -q helix core ai models mapping animation export tools tests main.py gui_launcher.py

      - name: Validate drummer/submodel stack
        if: ${{ inputs.run_drummer != 'false' }}
        run: |
          pytest -q tests/test_drummer_layers.py tests/test_drummer_xmodel_asset.py tests/test_drummer_v3_pose_sheet.py tests/test_drummer_v3_png_layers.py tests/test_finished_helixville4_drummer.py

      - name: Validate preview stack
        run: |
          pytest -q tests/test_preview_hq.py tests/test_render_xsq_skeleton_preview.py tests/test_export_demo_xsq.py

      - name: Generate deterministic ground-truth drum audio
        run: |
          mkdir -p wand_output
          python - <<'PY'
          import math, os, struct, wave
          duration = max(1.0, float(os.environ.get('HELIX_DURATION', '20')))
          sr = 44100
          frames = int(duration * sr)
          bpm = 120.0
          beat = 60.0 / bpm
          out = 'wand_output/helix_drummer_ground_truth.wav'
          with wave.open(out, 'wb') as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(sr)
              for i in range(frames):
                  t = i / sr
                  phase = t % beat
                  beat_i = int(t / beat)
                  kick = math.exp(-phase * 35.0) * math.sin(2*math.pi*(65-25*min(phase/0.08,1))*t) if beat_i % 4 in (0,2) else 0.0
                  snare_phase = (t - beat*1.0) % (beat*2)
                  snare = math.exp(-snare_phase*55.0) * (math.sin(2*math.pi*1800*t)+0.5*math.sin(2*math.pi*2400*t)) if snare_phase < 0.09 else 0.0
                  hat_phase = t % (beat/2)
                  hat = math.exp(-hat_phase*90.0) * math.sin(2*math.pi*7000*t) * 0.22
                  accent_phase = (t - 2.0) % 4.0
                  tom = 0.12 * math.exp(-((accent_phase) * 22.0)) * math.sin(2*math.pi*140*t) if accent_phase < 0.12 else 0.0
                  cym = 0.10 * math.exp(-((accent_phase) * 35.0)) * math.sin(2*math.pi*5200*t) if accent_phase < 0.12 else 0.0
                  bass = 0.10 * math.sin(2*math.pi*(110 + 25*math.sin(2*math.pi*t/4))*t)
                  x = max(-0.95, min(0.95, 0.42*kick + 0.18*snare + hat + tom + cym + bass))
                  s = int(x * 32767)
                  w.writeframes(struct.pack('<hh', s, s))
          PY
          test -s wand_output/helix_drummer_ground_truth.wav

      - name: Run canonical Helix pipeline
        run: |
          AUDIO="${{ inputs.audio_source }}"
          if [ -z "$AUDIO" ]; then AUDIO="wand_output/helix_drummer_ground_truth.wav"; fi
          python -m helix run --audio "$AUDIO" --layout "${{ inputs.layout || 'allmodels/xlights_rgbeffects.xml' }}" --output wand_output/Helix_wand/Helix_wand
          python tools/validate_xsq_structure.py wand_output/Helix_wand/Helix_wand.xsq
          test -s wand_output/Helix_wand/Helix_wand.mp4
          test -s wand_output/Helix_wand/validation.json
          python - <<'PY'
          import json
          payload = json.load(open('wand_output/Helix_wand/validation.json', encoding='utf-8'))
          required = payload['required_drummer_submodels']
          missing = [name for name, present in required.items() if not present]
          if missing:
              raise SystemExit(f'Missing drummer submodel events: {missing}')
          media = payload['media']
          if not media.get('has_audio') or not media.get('has_video'):
              raise SystemExit('VALIDATION FAILED: MP4 must contain both audio and video')
          print('HELIX WAND PASSED: canonical XSQ + MP4 + WAV + diagnostics generated')
          PY

      - name: Package Android-ready Helix artifacts
        run: |
          mkdir -p wand_output/android_artifact/diagnostics
          cp wand_output/Helix_wand/Helix_wand.mp4 wand_output/android_artifact/Helix_wand.mp4
          cp wand_output/Helix_wand/Helix_wand.xsq wand_output/android_artifact/Helix_wand.xsq
          cp wand_output/Helix_wand/Helix_wand.wav wand_output/android_artifact/Helix_wand.wav
          cp wand_output/Helix_wand/manifest.json wand_output/android_artifact/Helix_wand_manifest.json
          cp wand_output/Helix_wand/validation.json wand_output/android_artifact/Helix_wand_validation.json
          cp wand_output/Helix_wand/analysis.json wand_output/android_artifact/diagnostics/analysis.json
          cp wand_output/Helix_wand/helix_events.json wand_output/android_artifact/diagnostics/helix_events.json

      - name: Upload Helix Wand results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helix-wand-results
          path: |
            wand_output/**
            fixtures/band_geometry/drummer_v3_pose_spec.json
            fixtures/band_geometry/drummer_v3_png_layer_manifest.json
            fixtures/band_geometry/models/HX_SNOWMAN_DRUMMER_V3.xmodel
          if-no-files-found: warn
